{% extends "base.html" %}

{% block title %}CMELTS Energy Anchor Chart{% endblock %}

{% block content %}

<style>
    .chart-page {
        background: white;
        border: 4px solid #111;
        border-radius: 22px;
        padding: 22px;
        box-shadow: 6px 6px 0 rgba(17,17,17,0.14);
    }

    .chart-img {
        width: 100%;
        max-width: 850px;
        display: block;
        margin: 0 auto;
        border: 4px solid #111;
        border-radius: 18px;
        background: white;
    }

    .chart-btn {
        border: 3px solid #111;
        border-radius: 12px;
        font-weight: 900;
        box-shadow: 3px 3px 0 rgba(17,17,17,0.2);
        margin: 4px;
    }

    @media print {
        nav, footer, .no-print {
            display: none !important;
        }

        .chart-page {
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
        }

        .chart-img {
            border: none !important;
            max-width: 100%;
        }
    }
</style>

<section class="chart-page">
    <div class="no-print">
        <h1>🔋 CMELTS: Forms of Energy</h1>
        <p>
            Unit 4 anchor chart for chemical, mechanical, electrical, light, thermal, and sound energy.
        </p>

        <button class="btn btn-warning chart-btn" onclick="window.print()">Print Anchor Chart</button>
        <a class="btn btn-primary chart-btn" href="/first-nine-weeks/day/37?view=teacher">Back to Unit 4</a>
        <a class="btn btn-success chart-btn" href="/first-nine-weeks">Back to Lessons</a>
    </div>

    <img class="chart-img" src="/static/anchor_charts/cmelts_forms_of_energy_clean.png?v=60" alt="CMELTS Forms of Energy Anchor Chart">
</section>

{% endblock %}
