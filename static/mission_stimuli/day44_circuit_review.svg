<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#f6fbff"/>
  <text x="600" y="55" text-anchor="middle" font-size="34" font-family="Arial, sans-serif" font-weight="700" fill="#2d2a6e">
    Day 44 Circuit Conductivity Review
  </text>
  <text x="600" y="95" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" fill="#444">
    Compare the two circuits. Which bulb lights, and why?
  </text>

  <!-- Left panel -->
  <rect x="60" y="130" width="500" height="500" rx="22" fill="#ffffff" stroke="#d7def7" stroke-width="4"/>
  <text x="310" y="170" text-anchor="middle" font-size="28" font-family="Arial, sans-serif" font-weight="700" fill="#5b3cc4">
    Circuit A
  </text>
  <text x="310" y="200" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" fill="#666">
    Material between the wires: Plastic
  </text>

  <!-- Wires left -->
  <path d="M140 520 L140 270 L210 270" fill="none" stroke="#f08a24" stroke-width="10" stroke-linecap="round"/>
  <path d="M410 270 L480 270 L480 520 L230 520" fill="none" stroke="#f08a24" stroke-width="10" stroke-linecap="round"/>

  <!-- Battery left -->
  <line x1="150" y1="520" x2="150" y2="470" stroke="#2d2a6e" stroke-width="8"/>
  <line x1="170" y1="520" x2="170" y2="490" stroke="#2d2a6e" stroke-width="4"/>
  <text x="160" y="550" text-anchor="middle" font-size="16" font-family="Arial, sans-serif" fill="#333">Battery</text>

  <!-- Bulb left -->
  <circle cx="310" cy="270" r="42" fill="#f3f5fa" stroke="#2d2a6e" stroke-width="6"/>
  <path d="M290 290 Q310 250 330 290" fill="none" stroke="#2d2a6e" stroke-width="4"/>
  <text x="310" y="345" text-anchor="middle" font-size="16" font-family="Arial, sans-serif" fill="#333">Bulb OFF</text>

  <!-- Switch left -->
  <line x1="230" y1="520" x2="280" y2="520" stroke="#2d2a6e" stroke-width="8"/>
  <line x1="280" y1="520" x2="315" y2="495" stroke="#2d2a6e" stroke-width="8"/>
  <circle cx="225" cy="520" r="6" fill="#2d2a6e"/>
  <circle cx="320" cy="520" r="6" fill="#2d2a6e"/>
  <text x="275" y="555" text-anchor="middle" font-size="16" font-family="Arial, sans-serif" fill="#333">Closed switch</text>

  <!-- Test material left -->
  <rect x="210" y="250" width="200" height="40" rx="10" fill="#ffd6e7" stroke="#c75a84" stroke-width="4"/>
  <text x="310" y="276" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" font-weight="700" fill="#7c214d">Plastic strip</text>

  <!-- Right panel -->
  <rect x="640" y="130" width="500" height="500" rx="22" fill="#ffffff" stroke="#d7def7" stroke-width="4"/>
  <text x="890" y="170" text-anchor="middle" font-size="28" font-family="Arial, sans-serif" font-weight="700" fill="#5b3cc4">
    Circuit B
  </text>
  <text x="890" y="200" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" fill="#666">
    Material between the wires: Copper
  </text>

  <!-- Wires right -->
  <path d="M720 520 L720 270 L790 270" fill="none" stroke="#f08a24" stroke-width="10" stroke-linecap="round"/>
  <path d="M990 270 L1060 270 L1060 520 L810 520" fill="none" stroke="#f08a24" stroke-width="10" stroke-linecap="round"/>

  <!-- Battery right -->
  <line x1="730" y1="520" x2="730" y2="470" stroke="#2d2a6e" stroke-width="8"/>
  <line x1="750" y1="520" x2="750" y2="490" stroke="#2d2a6e" stroke-width="4"/>
  <text x="740" y="550" text-anchor="middle" font-size="16" font-family="Arial, sans-serif" fill="#333">Battery</text>

  <!-- Bulb right ON -->
  <circle cx="890" cy="270" r="42" fill="#fff4a8" stroke="#2d2a6e" stroke-width="6"/>
  <path d="M870 290 Q890 250 910 290" fill="none" stroke="#2d2a6e" stroke-width="4"/>
  <line x1="890" y1="205" x2="890" y2="185" stroke="#f6c700" stroke-width="5"/>
  <line x1="930" y1="220" x2="945" y2="205" stroke="#f6c700" stroke-width="5"/>
  <line x1="850" y1="220" x2="835" y2="205" stroke="#f6c700" stroke-width="5"/>
  <line x1="930" y1="320" x2="945" y2="335" stroke="#f6c700" stroke-width="5"/>
  <line x1="850" y1="320" x2="835" y2="335" stroke="#f6c700" stroke-width="5"/>
  <text x="890" y="345" text-anchor="middle" font-size="16" font-family="Arial, sans-serif" fill="#333">Bulb ON</text>

  <!-- Switch right -->
  <line x1="810" y1="520" x2="860" y2="520" stroke="#2d2a6e" stroke-width="8"/>
  <line x1="860" y1="520" x2="895" y2="495" stroke="#2d2a6e" stroke-width="8"/>
  <circle cx="805" cy="520" r="6" fill="#2d2a6e"/>
  <circle cx="900" cy="520" r="6" fill="#2d2a6e"/>
  <text x="855" y="555" text-anchor="middle" font-size="16" font-family="Arial, sans-serif" fill="#333">Closed switch</text>

  <!-- Test material right -->
  <rect x="790" y="250" width="200" height="40" rx="10" fill="#ffe0b8" stroke="#c97925" stroke-width="4"/>
  <text x="890" y="276" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" font-weight="700" fill="#8b4b09">Copper strip</text>

  <!-- Footer -->
  <rect x="140" y="610" width="920" height="56" rx="16" fill="#ede9ff" stroke="#b9a7ff" stroke-width="2"/>
  <text x="600" y="645" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" fill="#2d2a6e" font-weight="700">
    Conductors allow electrical energy to flow. Insulators block or resist that flow.
  </text>
</svg>
