<svg xmlns="http://www.w3.org/2000/svg"
     width="1100"
     height="610"
     viewBox="0 0 1100 610">

  <rect width="1100" height="610" fill="#f6fbff"/>

  <text x="550" y="48"
        text-anchor="middle"
        font-family="Arial"
        font-size="31"
        font-weight="bold"
        fill="#20276b">
    Phenomenon Mission: What Does a Circuit Need?
  </text>

  <text x="550" y="82"
        text-anchor="middle"
        font-family="Arial"
        font-size="18"
        fill="#20276b">
    Examine the parts. Which job does each part perform?
  </text>


  <!-- BATTERY -->
  <g transform="translate(160 260)">
    <rect x="-42" y="-72"
          width="84" height="144"
          rx="12"
          fill="#ffc400"
          stroke="#111"
          stroke-width="4"/>

    <rect x="-16" y="-87"
          width="32" height="15"
          fill="#333"/>

    <rect x="-16" y="72"
          width="32" height="15"
          fill="#333"/>

    <text x="0" y="-8"
          text-anchor="middle"
          font-family="Arial"
          font-size="16"
          font-weight="bold">
      BATTERY
    </text>

    <text x="0" y="20"
          text-anchor="middle"
          font-family="Arial"
          font-size="14">
      Power Source
    </text>

    <text x="54" y="-70"
          font-family="Arial"
          font-size="25"
          font-weight="bold"
          fill="#07823c">+</text>

    <text x="54" y="90"
          font-family="Arial"
          font-size="25"
          font-weight="bold"
          fill="#c01825">−</text>
  </g>


  <!-- WIRE -->
  <g transform="translate(380 255)">
    <path d="M -80 25 C -25 -65 35 95 90 5"
          fill="none"
          stroke="#ef7d22"
          stroke-width="10"
          stroke-linecap="round"/>

    <circle cx="-80" cy="25" r="12"
            fill="#d6ffd8"
            stroke="#087a35"
            stroke-width="4"/>

    <circle cx="90" cy="5" r="12"
            fill="#d6ffd8"
            stroke="#087a35"
            stroke-width="4"/>

    <text x="5" y="125"
          text-anchor="middle"
          font-family="Arial"
          font-size="19"
          font-weight="bold">
      WIRE
    </text>

    <text x="5" y="150"
          text-anchor="middle"
          font-family="Arial"
          font-size="15">
      Conducting Path
    </text>
  </g>


  <!-- SWITCH -->
  <g transform="translate(570 260)">
    <rect x="-72" y="-45"
          width="144" height="90"
          rx="15"
          fill="#ffffff"
          stroke="#111"
          stroke-width="4"/>

    <circle cx="-40" cy="15" r="8"
            fill="#111"/>

    <circle cx="40" cy="15" r="8"
            fill="#111"/>

    <line x1="-40" y1="15"
          x2="30" y2="-20"
          stroke="#111"
          stroke-width="8"
          stroke-linecap="round"/>

    <text x="0" y="87"
          text-anchor="middle"
          font-family="Arial"
          font-size="19"
          font-weight="bold">
      SWITCH
    </text>

    <text x="0" y="112"
          text-anchor="middle"
          font-family="Arial"
          font-size="15">
      Opens or Closes the Path
    </text>
  </g>


  <!-- BULB -->
  <g transform="translate(760 240)">
    <circle cx="0" cy="0"
            r="52"
            fill="#fff8b8"
            stroke="#111"
            stroke-width="4"/>

    <path d="M -22 0 Q 0 -34 22 0 Q 0 34 -22 0"
          fill="none"
          stroke="#555"
          stroke-width="5"/>

    <rect x="-31" y="46"
          width="62"
          height="31"
          rx="6"
          fill="#f08a24"
          stroke="#111"
          stroke-width="4"/>

    <text x="0" y="120"
          text-anchor="middle"
          font-family="Arial"
          font-size="19"
          font-weight="bold">
      BULB
    </text>

    <text x="0" y="145"
          text-anchor="middle"
          font-family="Arial"
          font-size="15">
      Light Load
    </text>
  </g>


  <!-- MOTOR / SPEAKER -->
  <g transform="translate(950 220)">
    <rect x="-60" y="-45"
          width="120" height="90"
          rx="17"
          fill="#d3eeff"
          stroke="#111"
          stroke-width="4"/>

    <circle cx="0" cy="0"
            r="28"
            fill="#fff"
            stroke="#111"
            stroke-width="3"/>

    <line x1="-20" y1="0"
          x2="20" y2="0"
          stroke="#4c8daa"
          stroke-width="6"/>

    <line x1="0" y1="-20"
          x2="0" y2="20"
          stroke="#4c8daa"
          stroke-width="6"/>

    <text x="0" y="83"
          text-anchor="middle"
          font-family="Arial"
          font-size="19"
          font-weight="bold">
      MOTOR
    </text>

    <text x="0" y="108"
          text-anchor="middle"
          font-family="Arial"
          font-size="15">
      Motion Load
    </text>
  </g>


  <rect x="100" y="455"
        width="900"
        height="92"
        rx="22"
        fill="#fff4cd"
        stroke="#20276b"
        stroke-width="3"/>

  <text x="550" y="493"
        text-anchor="middle"
        font-family="Arial"
        font-size="20"
        font-weight="bold"
        fill="#20276b">
    Focus Question
  </text>

  <text x="550" y="526"
        text-anchor="middle"
        font-family="Arial"
        font-size="19"
        fill="#20276b">
    How do these parts work together to make one electrical system?
  </text>

</svg>
