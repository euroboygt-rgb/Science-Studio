<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1100 620">

  <rect width="1100"
        height="620"
        rx="24"
        fill="#f5faff"/>

  <text x="550"
        y="48"
        text-anchor="middle"
        font-size="34"
        font-weight="900"
        fill="#20346f">
    PHENOMENON MISSION: MAKE THE BULB LIGHT
  </text>

  <text x="550"
        y="82"
        text-anchor="middle"
        font-size="19"
        font-weight="700"
        fill="#20346f">
    You may use one battery, two wires, and one bulb.
  </text>


  <rect x="95"
        y="120"
        width="910"
        height="360"
        rx="25"
        fill="#ffffff"
        stroke="#c8d5ef"
        stroke-width="4"/>


  <!-- BATTERY -->
  <g transform="translate(245 295)">

    <rect x="-50"
          y="-90"
          width="100"
          height="180"
          rx="12"
          fill="#ffc400"
          stroke="#111"
          stroke-width="5"/>

    <circle cx="0"
            cy="-105"
            r="10"
            fill="#d8ffd9"
            stroke="#087a35"
            stroke-width="5"/>

    <circle cx="0"
            cy="105"
            r="10"
            fill="#ffdada"
            stroke="#b00020"
            stroke-width="5"/>

    <text x="20"
          y="-98"
          font-size="28"
          font-weight="900"
          fill="#087a35">
      +
    </text>

    <text x="20"
          y="116"
          font-size="28"
          font-weight="900"
          fill="#b00020">
      −
    </text>

    <text x="0"
          y="-8"
          text-anchor="middle"
          font-size="17"
          font-weight="900">
      BATTERY
    </text>

    <text x="0"
          y="18"
          text-anchor="middle"
          font-size="14">
      POWER SOURCE
    </text>

  </g>


  <!-- TOP WIRE -->
  <path d="M 245 190
           C 365 140 520 145 675 205"
        fill="none"
        stroke="#f0831e"
        stroke-width="11"
        stroke-linecap="round"/>

  <text x="435"
        y="155"
        text-anchor="middle"
        font-size="20"
        font-weight="900"
        fill="#185692">
    WIRE 1
  </text>


  <!-- BULB -->
  <g transform="translate(760 275)">

    <circle cx="0"
            cy="0"
            r="66"
            fill="#fff3a0"
            stroke="#d69f00"
            stroke-width="6"/>

    <circle cx="0"
            cy="0"
            r="35"
            fill="#ffe45e"/>

    <path d="M -22 0
             Q 0 -33 22 0
             Q 0 33 -22 0"
          fill="none"
          stroke="#444"
          stroke-width="5"/>

    <rect x="-30"
          y="59"
          width="60"
          height="34"
          rx="5"
          fill="#f0831e"
          stroke="#111"
          stroke-width="4"/>

    <text x="0"
          y="128"
          text-anchor="middle"
          font-size="20"
          font-weight="900">
      BULB / LOAD
    </text>

  </g>


  <!-- RETURN WIRE -->
  <path d="M 760 368
           C 650 445 405 445 245 400"
        fill="none"
        stroke="#f0831e"
        stroke-width="11"
        stroke-linecap="round"/>

  <text x="500"
        y="452"
        text-anchor="middle"
        font-size="20"
        font-weight="900"
        fill="#185692">
    WIRE 2
  </text>


  <!-- FLOW ARROWS -->
  <text x="480"
        y="245"
        text-anchor="middle"
        font-size="26"
        font-weight="900"
        fill="#7430c7">
    COMPLETE CONDUCTING PATH
  </text>

  <text x="480"
        y="282"
        text-anchor="middle"
        font-size="18"
        font-weight="700"
        fill="#24336b">
    + → wire → bulb → wire → −
  </text>


  <rect x="145"
        y="515"
        width="810"
        height="68"
        rx="16"
        fill="#fff3ac"
        stroke="#24336b"
        stroke-width="3"/>

  <text x="550"
        y="545"
        text-anchor="middle"
        font-size="18"
        font-weight="900"
        fill="#24336b">
    Focus Question
  </text>

  <text x="550"
        y="570"
        text-anchor="middle"
        font-size="19"
        font-weight="800"
        fill="#24336b">
    Why does connecting both battery terminals through the bulb make it light?
  </text>

</svg>
