<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#f6fbff"/>

  <text x="600" y="50" text-anchor="middle"
        font-family="Arial" font-size="38" font-weight="900" fill="#2d2a6e">
    Phenomenon Mission: Why Won't the System Work?
  </text>

  <text x="600" y="88" text-anchor="middle"
        font-family="Arial" font-size="22" font-weight="700" fill="#2d2a6e">
    Diagnose the circuit. Find the problem. Repair the system.
  </text>

  <rect x="125" y="145" width="950" height="430" rx="28"
        fill="#fff" stroke="#d7def7" stroke-width="5"/>

  <!-- battery -->
  <rect x="190" y="365" width="90" height="125" rx="8"
        fill="#ffc400" stroke="#111" stroke-width="5"/>
  <line x1="217" y1="340" x2="217" y2="365" stroke="#111" stroke-width="5"/>
  <line x1="255" y1="325" x2="255" y2="365" stroke="#111" stroke-width="5"/>
  <text x="235" y="525" text-anchor="middle"
        font-family="Arial" font-size="20" font-weight="900">Battery</text>

  <!-- switch -->
  <rect x="380" y="380" width="135" height="90" rx="12"
        fill="#fff" stroke="#111" stroke-width="5"/>

  <line x1="400" y1="445" x2="490" y2="400"
        stroke="#111" stroke-width="8" stroke-linecap="round"/>

  <circle cx="400" cy="445" r="8" fill="#111"/>
  <circle cx="500" cy="445" r="8" fill="#111"/>

  <text x="448" y="510" text-anchor="middle"
        font-family="Arial" font-size="20" font-weight="900">
    Open Switch
  </text>

  <!-- load -->
  <circle cx="790" cy="325" r="62"
          fill="#eeeeee" stroke="#111" stroke-width="5"/>

  <path d="M765 325 Q790 285 815 325 Q790 365 765 325"
        fill="none" stroke="#777" stroke-width="5"/>

  <text x="790" y="415" text-anchor="middle"
        font-family="Arial" font-size="20" font-weight="900">
    Bulb OFF
  </text>

  <!-- broken path -->
  <path d="M255 325 L255 235 L728 235 L748 285"
        stroke="#f08a24" stroke-width="10" fill="none"/>

  <path d="M832 325 L930 325 L930 445 L620 445"
        stroke="#f08a24" stroke-width="10" fill="none"/>

  <path d="M570 445 L515 445"
        stroke="#f08a24" stroke-width="10" fill="none"/>

  <path d="M380 425 L280 425"
        stroke="#f08a24" stroke-width="10" fill="none"/>

  <!-- gap -->
  <line x1="570" y1="445" x2="620" y2="445"
        stroke="#b00020" stroke-width="5" stroke-dasharray="8 8"/>

  <circle cx="595" cy="445" r="32"
          fill="#ffe1e1" stroke="#b00020" stroke-width="5"/>

  <text x="595" y="454" text-anchor="middle"
        font-family="Arial" font-size="28" font-weight="900" fill="#b00020">
    ?
  </text>

  <!-- clues -->
  <rect x="145" y="105" width="270" height="52" rx="14"
        fill="#fff7d6" stroke="#111" stroke-width="3"/>

  <text x="280" y="138" text-anchor="middle"
        font-family="Arial" font-size="18" font-weight="900">
    Clue 1: battery is connected
  </text>

  <rect x="455" y="105" width="280" height="52" rx="14"
        fill="#ffe1e1" stroke="#111" stroke-width="3"/>

  <text x="595" y="138" text-anchor="middle"
        font-family="Arial" font-size="18" font-weight="900">
    Clue 2: the switch is open
  </text>

  <rect x="775" y="105" width="285" height="52" rx="14"
        fill="#ede9ff" stroke="#111" stroke-width="3"/>

  <text x="918" y="138" text-anchor="middle"
        font-family="Arial" font-size="18" font-weight="900">
    Clue 3: there is a gap
  </text>

  <rect x="225" y="610" width="750" height="52" rx="16"
        fill="#eaf7ed" stroke="#2d2a6e" stroke-width="3"/>

  <text x="600" y="643" text-anchor="middle"
        font-family="Arial" font-size="20" font-weight="900" fill="#2d2a6e">
    Focus Question: What must be repaired before electrical energy can flow?
  </text>
</svg>
