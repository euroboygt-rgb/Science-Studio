<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 700">

  <defs>
    <linearGradient id="sky"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="1">
      <stop offset="0%"
            stop-color="#537aa6"/>
      <stop offset="100%"
            stop-color="#dff5ff"/>
    </linearGradient>
  </defs>

  <rect width="1200"
        height="700"
        rx="24"
        fill="url(#sky)"/>

  <text x="600"
        y="40"
        text-anchor="middle"
        fill="#102252"
        font-size="28"
        font-weight="900">
    PHENOMENON MISSION:
  </text>

  <text x="600"
        y="78"
        text-anchor="middle"
        fill="#102252"
        font-size="32"
        font-weight="900">
    WHY DOES DIFFERENT PRECIPITATION FALL FROM CLOUDS?
  </text>

  <!-- SMALLER / LIGHTER CLOUD -->
  <g fill="#ffffff"
     fill-opacity="0.82"
     stroke="#b7d8ed"
     stroke-width="4">

    <circle cx="530"
            cy="150"
            r="50"/>

    <circle cx="600"
            cy="120"
            r="66"/>

    <circle cx="670"
            cy="150"
            r="54"/>

    <rect x="485"
          y="148"
          width="230"
          height="64"
          rx="32"/>
  </g>

  <!-- RAIN -->
  <g stroke="#216bd1"
     stroke-width="8"
     stroke-linecap="round">
    <line x1="300"
          y1="295"
          x2="280"
          y2="365"/>
    <line x1="345"
          y1="295"
          x2="325"
          y2="375"/>
    <line x1="390"
          y1="295"
          x2="370"
          y2="365"/>
  </g>

  <text x="335"
        y="425"
        text-anchor="middle"
        fill="#102252"
        font-size="25"
        font-weight="900">
    RAIN
  </text>

  <!-- SNOW -->
  <g fill="#ffffff"
     stroke="#6d8cab"
     stroke-width="2"
     font-size="42"
     font-weight="900">
    <text x="505"
          y="340">❄</text>
    <text x="555"
          y="390">❄</text>
    <text x="605"
          y="335">❄</text>
  </g>

  <text x="555"
        y="455"
        text-anchor="middle"
        fill="#102252"
        font-size="25"
        font-weight="900">
    SNOW
  </text>

  <!-- SLEET -->
  <g fill="#dff5ff"
     stroke="#4e6b88"
     stroke-width="3">
    <circle cx="735"
            cy="330"
            r="12"/>
    <circle cx="780"
            cy="370"
            r="12"/>
    <circle cx="825"
            cy="330"
            r="12"/>
  </g>

  <text x="780"
        y="430"
        text-anchor="middle"
        fill="#102252"
        font-size="25"
        font-weight="900">
    SLEET / ICE PELLETS
  </text>

  <!-- HAIL -->
  <g fill="#effaff"
     stroke="#566d83"
     stroke-width="4">
    <circle cx="965"
            cy="315"
            r="22"/>
    <circle cx="1020"
            cy="365"
            r="28"/>
    <circle cx="1080"
            cy="320"
            r="20"/>
  </g>

  <path d="
    M1025 285
    C1080 225 1070 165 1030 130
  "
    fill="none"
    stroke="#7131cc"
    stroke-width="9"
    stroke-linecap="round"/>

  <polygon
    points="1030,125 1002,148 1042,158"
    fill="#7131cc"/>

  <text x="1025"
        y="430"
        text-anchor="middle"
        fill="#102252"
        font-size="25"
        font-weight="900">
    HAIL
  </text>

  <rect x="135"
        y="540"
        width="930"
        height="95"
        rx="18"
        fill="#fff2a5"
        stroke="#173769"
        stroke-width="4"/>

  <text x="600"
        y="578"
        text-anchor="middle"
        fill="#17213b"
        font-size="21"
        font-weight="900">
    SAME WATER — DIFFERENT CONDITIONS
  </text>

  <text x="600"
        y="612"
        text-anchor="middle"
        fill="#7131cc"
        font-size="20"
        font-weight="900">
    What evidence can tell us what will reach the ground?
  </text>

</svg>
