<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1100 650">

  <rect width="1100"
        height="650"
        rx="24"
        fill="#f5faff"/>

  <text x="550"
        y="50"
        text-anchor="middle"
        font-family="Arial"
        font-size="34"
        font-weight="900"
        fill="#20346f">
    PHENOMENON MISSION: CAN ONE BATTERY POWER TWO BULBS?
  </text>

  <text x="550"
        y="84"
        text-anchor="middle"
        font-family="Arial"
        font-size="19"
        font-weight="700"
        fill="#20346f">
    Trace the single conducting path.
  </text>


  <rect x="105"
        y="125"
        width="890"
        height="390"
        rx="24"
        fill="#fff"
        stroke="#c8d5ef"
        stroke-width="4"/>


  <!-- BATTERY -->

  <rect x="165"
        y="245"
        width="80"
        height="140"
        rx="10"
        fill="#ffc400"
        stroke="#111"
        stroke-width="5"/>

  <circle cx="205"
          cy="228"
          r="10"
          fill="#d8ffd9"
          stroke="#087a35"
          stroke-width="5"/>

  <circle cx="205"
          cy="402"
          r="10"
          fill="#ffdada"
          stroke="#b00020"
          stroke-width="5"/>

  <text x="226"
        y="223"
        font-size="26"
        font-weight="900"
        fill="#087a35">
    +
  </text>

  <text x="226"
        y="416"
        font-size="26"
        font-weight="900"
        fill="#b00020">
    −
  </text>

  <text x="205"
        y="315"
        text-anchor="middle"
        font-size="16"
        font-weight="900">
    BATTERY
  </text>


  <!-- WIRE BATTERY TO BULB 1 -->

  <path d="M205 228
           C300 160 385 165 445 225"
        fill="none"
        stroke="#f0831e"
        stroke-width="10"
        stroke-linecap="round"/>


  <!-- BULB 1 -->

  <circle cx="465"
          cy="285"
          r="58"
          fill="#fff3a0"
          stroke="#d69f00"
          stroke-width="5"/>

  <circle cx="465"
          cy="285"
          r="31"
          fill="#ffe45d"/>

  <path d="M444 285
           Q465 255 486 285
           Q465 315 444 285"
        fill="none"
        stroke="#444"
        stroke-width="5"/>

  <rect x="440"
        y="337"
        width="50"
        height="30"
        rx="5"
        fill="#f0831e"
        stroke="#111"
        stroke-width="4"/>

  <text x="465"
        y="405"
        text-anchor="middle"
        font-size="19"
        font-weight="900">
    BULB 1
  </text>


  <!-- WIRE BULB 1 TO BULB 2 -->

  <path d="M493 350
           C555 410 625 410 678 350"
        fill="none"
        stroke="#7131cc"
        stroke-width="10"
        stroke-linecap="round"/>


  <!-- BULB 2 -->

  <circle cx="705"
          cy="285"
          r="58"
          fill="#fff3a0"
          stroke="#d69f00"
          stroke-width="5"/>

  <circle cx="705"
          cy="285"
          r="31"
          fill="#ffe45d"/>

  <path d="M684 285
           Q705 255 726 285
           Q705 315 684 285"
        fill="none"
        stroke="#444"
        stroke-width="5"/>

  <rect x="680"
        y="337"
        width="50"
        height="30"
        rx="5"
        fill="#f0831e"
        stroke="#111"
        stroke-width="4"/>

  <text x="705"
        y="405"
        text-anchor="middle"
        font-size="19"
        font-weight="900">
    BULB 2
  </text>


  <!-- RETURN WIRE -->

  <path d="M733 350
           C835 430 850 465 700 470
           L370 470
           C285 465 235 440 205 402"
        fill="none"
        stroke="#1681ee"
        stroke-width="10"
        stroke-linecap="round"/>


  <!-- PATH LABEL -->

  <rect x="340"
        y="145"
        width="430"
        height="55"
        rx="12"
        fill="#e7ddff"
        stroke="#7131cc"
        stroke-width="3"/>

  <text x="555"
        y="179"
        text-anchor="middle"
        font-size="21"
        font-weight="900"
        fill="#402080">
    ONE CONTINUOUS CONDUCTING PATH
  </text>


  <!-- TRACE ARROWS -->

  <text x="315"
        y="190"
        font-size="28"
        font-weight="900"
        fill="#087a35">
    →
  </text>

  <text x="575"
        y="390"
        font-size="28"
        font-weight="900"
        fill="#7131cc">
    →
  </text>

  <text x="545"
        y="495"
        font-size="28"
        font-weight="900"
        fill="#1681ee">
    ←
  </text>


  <rect x="150"
        y="550"
        width="800"
        height="65"
        rx="15"
        fill="#fff4a8"
        stroke="#24336b"
        stroke-width="3"/>

  <text x="550"
        y="576"
        text-anchor="middle"
        font-size="18"
        font-weight="900"
        fill="#24336b">
    FOCUS QUESTION
  </text>

  <text x="550"
        y="602"
        text-anchor="middle"
        font-size="20"
        font-weight="900"
        fill="#24336b">
    How can two bulbs be part of the same electrical path?
  </text>

</svg>
