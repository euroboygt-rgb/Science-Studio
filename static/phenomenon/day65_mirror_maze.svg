<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1100 650">

  <rect width="1100"
        height="650"
        rx="24"
        fill="#f6fbff"/>

  <text x="550"
        y="48"
        text-anchor="middle"
        font-size="34"
        font-weight="900"
        fill="#20346f">
    PHENOMENON MISSION: CAN LIGHT GET AROUND THE WALL?
  </text>

  <text x="550"
        y="82"
        text-anchor="middle"
        font-size="20"
        font-weight="700"
        fill="#20346f">
    The flashlight and target cannot move.
  </text>

  <rect x="60"
        y="115"
        width="980"
        height="420"
        rx="24"
        fill="#071120"
        stroke="#cad7ef"
        stroke-width="4"/>

  <!-- flashlight -->

  <rect x="100"
        y="385"
        width="140"
        height="72"
        rx="18"
        fill="#7131cc"
        stroke="#ffffff"
        stroke-width="5"/>

  <rect x="215"
        y="360"
        width="70"
        height="122"
        rx="12"
        fill="#9d70df"
        stroke="#ffffff"
        stroke-width="5"/>

  <circle cx="286"
          cy="421"
          r="40"
          fill="#fff3a0"
          stroke="#ffffff"
          stroke-width="5"/>

  <!-- blocked straight path -->

  <line x1="330"
        y1="421"
        x2="510"
        y2="421"
        stroke="#fff6a9"
        stroke-width="10"/>

  <!-- blocker -->

  <rect x="510"
        y="260"
        width="105"
        height="245"
        rx="8"
        fill="#333a49"
        stroke="#ffffff"
        stroke-width="5"/>

  <text x="562"
        y="385"
        text-anchor="middle"
        fill="#ffffff"
        font-size="19"
        font-weight="900">
    WALL
  </text>

  <!-- possible mirrors -->

  <g transform="translate(430,420) rotate(-28)">
    <line x1="0"
          y1="-55"
          x2="0"
          y2="55"
          stroke="#253746"
          stroke-width="25"
          stroke-linecap="round"/>
    <line x1="0"
          y1="-50"
          x2="0"
          y2="50"
          stroke="#d9f5ff"
          stroke-width="15"
          stroke-linecap="round"/>
  </g>

  <g transform="translate(670,185) rotate(-30)">
    <line x1="0"
          y1="-55"
          x2="0"
          y2="55"
          stroke="#253746"
          stroke-width="25"
          stroke-linecap="round"/>
    <line x1="0"
          y1="-50"
          x2="0"
          y2="50"
          stroke="#d9f5ff"
          stroke-width="15"
          stroke-linecap="round"/>
  </g>

  <!-- suggested reflected path -->

  <path d="M430 420
           L670 185
           L850 150"
        fill="none"
        stroke="#ffe45d"
        stroke-width="9"
        stroke-dasharray="17 12"
        opacity=".8"/>

  <!-- target -->

  <circle cx="875"
          cy="145"
          r="65"
          fill="#fff4a8"
          stroke="#ffffff"
          stroke-width="5"/>

  <circle cx="875"
          cy="145"
          r="38"
          fill="#ffe45d"/>

  <circle cx="875"
          cy="145"
          r="15"
          fill="#f0831e"/>

  <text x="875"
        y="235"
        text-anchor="middle"
        fill="#ffffff"
        font-size="18"
        font-weight="900">
    TARGET
  </text>

  <rect x="150"
        y="560"
        width="800"
        height="62"
        rx="14"
        fill="#fff4a8"
        stroke="#24336b"
        stroke-width="3"/>

  <text x="550"
        y="585"
        text-anchor="middle"
        font-size="18"
        font-weight="900"
        fill="#24336b">
    ENGINEERING CHALLENGE
  </text>

  <text x="550"
        y="610"
        text-anchor="middle"
        font-size="20"
        font-weight="900"
        fill="#24336b">
    Where would you place mirrors to reach the target?
  </text>

</svg>
