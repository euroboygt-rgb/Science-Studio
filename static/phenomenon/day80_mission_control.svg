<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 700">

  <rect width="1200"
        height="700"
        rx="25"
        fill="#071120"/>

  <text x="600"
        y="55"
        text-anchor="middle"
        fill="#ffffff"
        font-size="36"
        font-weight="900">
    EARTH ROTATION MISSION CONTROL
  </text>

  <text x="600"
        y="95"
        text-anchor="middle"
        fill="#ffe45d"
        font-size="22"
        font-weight="900">
    SYSTEM FAILURE — SCIENCE CREW REQUIRED
  </text>


  <!-- CENTER EARTH -->

  <circle cx="600"
          cy="330"
          r="145"
          fill="#168de3"
          stroke="#ffffff"
          stroke-width="7"/>

  <path d="
    M500 270
    Q550 220 620 245
    Q645 270 625 305
    Q585 315 565 350
    Q520 335 500 300
    Z
  "
    fill="#4fbd57"/>

  <line x1="550"
        y1="145"
        x2="655"
        y2="515"
        stroke="#ffe45d"
        stroke-width="10"
        stroke-linecap="round"/>


  <!-- SYSTEM CARDS -->

  <rect x="65"
        y="155"
        width="300"
        height="125"
        rx="16"
        fill="#351657"
        stroke="#ffffff"
        stroke-width="4"/>

  <text x="215"
        y="195"
        text-anchor="middle"
        fill="#ffffff"
        font-size="23"
        font-weight="900">
    SYSTEM 1
  </text>

  <text x="215"
        y="232"
        text-anchor="middle"
        fill="#ffe45d"
        font-size="19"
        font-weight="900">
    AXIS &amp; ROTATION
  </text>

  <text x="215"
        y="260"
        text-anchor="middle"
        fill="#ff7070"
        font-size="18"
        font-weight="900">
    OFFLINE
  </text>


  <rect x="835"
        y="155"
        width="300"
        height="125"
        rx="16"
        fill="#351657"
        stroke="#ffffff"
        stroke-width="4"/>

  <text x="985"
        y="195"
        text-anchor="middle"
        fill="#ffffff"
        font-size="23"
        font-weight="900">
    SYSTEM 2
  </text>

  <text x="985"
        y="232"
        text-anchor="middle"
        fill="#ffe45d"
        font-size="19"
        font-weight="900">
    DAY / NIGHT
  </text>

  <text x="985"
        y="260"
        text-anchor="middle"
        fill="#ff7070"
        font-size="18"
        font-weight="900">
    OFFLINE
  </text>


  <rect x="65"
        y="390"
        width="300"
        height="125"
        rx="16"
        fill="#351657"
        stroke="#ffffff"
        stroke-width="4"/>

  <text x="215"
        y="430"
        text-anchor="middle"
        fill="#ffffff"
        font-size="23"
        font-weight="900">
    SYSTEM 3
  </text>

  <text x="215"
        y="467"
        text-anchor="middle"
        fill="#ffe45d"
        font-size="19"
        font-weight="900">
    APPARENT SUN
  </text>

  <text x="215"
        y="495"
        text-anchor="middle"
        fill="#ff7070"
        font-size="18"
        font-weight="900">
    OFFLINE
  </text>


  <rect x="835"
        y="390"
        width="300"
        height="125"
        rx="16"
        fill="#351657"
        stroke="#ffffff"
        stroke-width="4"/>

  <text x="985"
        y="430"
        text-anchor="middle"
        fill="#ffffff"
        font-size="23"
        font-weight="900">
    SYSTEM 4
  </text>

  <text x="985"
        y="467"
        text-anchor="middle"
        fill="#ffe45d"
        font-size="19"
        font-weight="900">
    SHADOW TRACKER
  </text>

  <text x="985"
        y="495"
        text-anchor="middle"
        fill="#ff7070"
        font-size="18"
        font-weight="900">
    OFFLINE
  </text>


  <rect x="190"
        y="590"
        width="820"
        height="70"
        rx="16"
        fill="#fff2a5"
        stroke="#ffffff"
        stroke-width="4"/>

  <text x="600"
        y="620"
        text-anchor="middle"
        fill="#17213b"
        font-size="20"
        font-weight="900">
    Can ONE motion of Earth explain all four system patterns?
  </text>

  <text x="600"
        y="647"
        text-anchor="middle"
        fill="#7131cc"
        font-size="19"
        font-weight="900">
    Restore Mission Control to find out.
  </text>

</svg>
