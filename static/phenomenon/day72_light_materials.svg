<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1100 650">

  <rect width="1100"
        height="650"
        rx="24"
        fill="#f6fbff"/>

  <text x="550"
        y="50"
        text-anchor="middle"
        font-size="34"
        font-weight="900"
        fill="#20346f">
    PHENOMENON MISSION: WHAT HAPPENS TO THE LIGHT?
  </text>

  <text x="550"
        y="85"
        text-anchor="middle"
        font-size="20"
        font-weight="700"
        fill="#20346f">
    The same flashlight shines on three different materials.
  </text>


  <!-- LIGHT SOURCE -->

  <circle cx="115"
          cy="320"
          r="55"
          fill="#fff3a0"
          stroke="#24336b"
          stroke-width="5"/>

  <text x="115"
        y="400"
        text-anchor="middle"
        font-size="18"
        font-weight="900"
        fill="#24336b">
    FLASHLIGHT
  </text>


  <!-- INCOMING LIGHT -->

  <line x1="170"
        y1="320"
        x2="300"
        y2="320"
        stroke="#ffe45d"
        stroke-width="20"
        stroke-linecap="round"/>


  <!-- TRANSPARENT -->

  <rect x="300"
        y="215"
        width="120"
        height="210"
        rx="8"
        fill="#bfeaff"
        fill-opacity=".38"
        stroke="#2689d8"
        stroke-width="6"/>

  <text x="360"
        y="460"
        text-anchor="middle"
        font-size="17"
        font-weight="900"
        fill="#20346f">
    CLEAR GLASS
  </text>

  <line x1="420"
        y1="320"
        x2="505"
        y2="320"
        stroke="#ffe45d"
        stroke-width="18"
        stroke-linecap="round"/>


  <!-- TRANSLUCENT -->

  <rect x="505"
        y="215"
        width="120"
        height="210"
        rx="8"
        fill="#dce8ef"
        stroke="#687984"
        stroke-width="6"/>

  <path d="M625 320
           L710 285
           M625 320
           L710 320
           M625 320
           L710 355"
        stroke="#ffe45d"
        stroke-width="10"
        stroke-linecap="round"/>

  <text x="565"
        y="460"
        text-anchor="middle"
        font-size="17"
        font-weight="900"
        fill="#20346f">
    WAX PAPER
  </text>


  <!-- OPAQUE -->

  <rect x="760"
        y="215"
        width="120"
        height="210"
        rx="8"
        fill="#8a684b"
        stroke="#3c2d21"
        stroke-width="6"/>

  <line x1="710"
        y1="320"
        x2="760"
        y2="320"
        stroke="#ffe45d"
        stroke-width="18"
        stroke-linecap="round"/>

  <text x="820"
        y="460"
        text-anchor="middle"
        font-size="17"
        font-weight="900"
        fill="#20346f">
    CARDBOARD
  </text>


  <text x="360"
        y="515"
        text-anchor="middle"
        font-size="19"
        font-weight="900"
        fill="#087a35">
    LIGHT PASSES CLEARLY
  </text>

  <text x="565"
        y="515"
        text-anchor="middle"
        font-size="19"
        font-weight="900"
        fill="#b16c00">
    LIGHT SCATTERS
  </text>

  <text x="820"
        y="515"
        text-anchor="middle"
        font-size="19"
        font-weight="900"
        fill="#b00020">
    LIGHT DOES NOT PASS THROUGH
  </text>


  <rect x="145"
        y="555"
        width="810"
        height="62"
        rx="14"
        fill="#fff4a8"
        stroke="#24336b"
        stroke-width="3"/>

  <text x="550"
        y="594"
        text-anchor="middle"
        font-size="22"
        font-weight="900"
        fill="#24336b">
    TRANSPARENT • TRANSLUCENT • OPAQUE
  </text>

</svg>
