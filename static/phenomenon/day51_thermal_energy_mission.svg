<!-- Science Studio Battery Standard Day 51 Phenomenon -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#f6fbff"/>

  <text x="600" y="52" text-anchor="middle"
        font-family="Arial" font-size="38" font-weight="900" fill="#2d2a6e">
    Phenomenon Mission: Why Does It Get Warm?
  </text>

  <text x="600" y="90" text-anchor="middle"
        font-family="Arial" font-size="22" font-weight="700" fill="#2d2a6e">
    Electrical energy can transform into thermal energy.
  </text>

  <rect x="125" y="145" width="950" height="430" rx="28"
        fill="#ffffff" stroke="#d7def7" stroke-width="5"/>

  <!-- Battery -->
  <rect x="200" y="365" width="90" height="125" rx="8"
        fill="#ffc400" stroke="#111" stroke-width="5"/>
  <line x1="227" y1="340" x2="227" y2="365" stroke="#111" stroke-width="5"/>
  <line x1="265" y1="325" x2="265" y2="365" stroke="#111" stroke-width="5"/>
  <circle cx="227" cy="340" r="6" fill="#fff" stroke="#111" stroke-width="3"/>
  <circle cx="265" cy="325" r="6" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="209" y="338" font-family="Arial" font-size="20" font-weight="900" fill="#b00020">−</text>
  <text x="274" y="325" font-family="Arial" font-size="20" font-weight="900" fill="#087a35">+</text>
  <text x="245" y="525" text-anchor="middle"
        font-family="Arial" font-size="20" font-weight="900">Battery</text>

  <!-- Switch -->
  <rect x="385" y="385" width="135" height="90" rx="12"
        fill="#ffffff" stroke="#111" stroke-width="5"/>
  <line x1="405" y1="450" x2="495" y2="405"
        stroke="#111" stroke-width="8" stroke-linecap="round"/>
  <circle cx="405" cy="450" r="8" fill="#111"/>
  <circle cx="495" cy="405" r="8" fill="#111"/>
  <text x="452" y="515" text-anchor="middle"
        font-family="Arial" font-size="20" font-weight="900">Closed Switch</text>

  <!-- Heating element -->
  <rect x="675" y="305" width="200" height="145" rx="24"
        fill="#ffe1e1" stroke="#111" stroke-width="5"/>

  <path d="M705 375
           C720 335 740 415 755 375
           C770 335 790 415 805 375
           C820 335 840 415 855 375"
        fill="none" stroke="#d62828" stroke-width="10"/>

  <text x="775" y="485" text-anchor="middle"
        font-family="Arial" font-size="20" font-weight="900">
    Heating Element
  </text>

  <!-- heat -->
  <path d="M700 280 C685 250 720 250 705 215
           M750 280 C735 250 770 250 755 215
           M800 280 C785 250 820 250 805 215
           M850 280 C835 250 870 250 855 215"
        fill="none" stroke="#ff7a00" stroke-width="9"
        stroke-linecap="round"/>

  <!-- thermometer -->
  <rect x="930" y="260" width="55" height="190" rx="25"
        fill="#ffffff" stroke="#111" stroke-width="5"/>
  <circle cx="958" cy="450" r="42"
          fill="#ff4d4d" stroke="#111" stroke-width="5"/>
  <rect x="948" y="305" width="20" height="135"
        fill="#ff4d4d"/>
  <line x1="990" y1="300" x2="1015" y2="300" stroke="#111" stroke-width="4"/>
  <line x1="990" y1="350" x2="1015" y2="350" stroke="#111" stroke-width="4"/>
  <line x1="990" y1="400" x2="1015" y2="400" stroke="#111" stroke-width="4"/>

  <text x="960" y="520" text-anchor="middle"
        font-family="Arial" font-size="20" font-weight="900">
    Temperature Rises
  </text>

  <!-- wires -->
  <path d="M265 325 L265 230 L675 230 L675 355"
        stroke="#f08a24" stroke-width="10" fill="none"/>

  <path d="M675 410 L520 430"
        stroke="#f08a24" stroke-width="10" fill="none"/>

  <path d="M385 430 L325 430 L325 340 L227 340"
        stroke="#f08a24" stroke-width="10" fill="none"/>

  <rect x="145" y="110" width="260" height="52" rx="14"
        fill="#fff7d6" stroke="#111" stroke-width="3"/>
  <text x="275" y="143" text-anchor="middle"
        font-family="Arial" font-size="18" font-weight="900">
    Battery: energy source
  </text>

  <rect x="455" y="110" width="280" height="52" rx="14"
        fill="#ede9ff" stroke="#111" stroke-width="3"/>
  <text x="595" y="143" text-anchor="middle"
        font-family="Arial" font-size="18" font-weight="900">
    Complete circuit: energy flows
  </text>

  <rect x="785" y="110" width="275" height="52" rx="14"
        fill="#ffe1e1" stroke="#111" stroke-width="3"/>
  <text x="922" y="143" text-anchor="middle"
        font-family="Arial" font-size="18" font-weight="900">
    Output: thermal energy
  </text>

  <rect x="225" y="610" width="750" height="52" rx="16"
        fill="#fff7d6" stroke="#2d2a6e" stroke-width="3"/>

  <text x="600" y="643" text-anchor="middle"
        font-family="Arial" font-size="20" font-weight="900" fill="#2d2a6e">
    Focus Question: What evidence shows electrical energy became thermal energy?
  </text>
</svg>
