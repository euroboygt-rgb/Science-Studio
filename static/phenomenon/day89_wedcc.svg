<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 700">

  <defs>
    <linearGradient id="sky"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="1">
      <stop offset="0%"
            stop-color="#88cdf0"/>
      <stop offset="100%"
            stop-color="#e8f6ff"/>
    </linearGradient>
  </defs>


  <rect width="1200"
        height="700"
        rx="24"
        fill="url(#sky)"/>


  <text x="600"
        y="45"
        text-anchor="middle"
        fill="#362416"
        font-size="29"
        font-weight="900">
    SEDIMENTARY ROCK MYSTERY
  </text>


  <text x="600"
        y="85"
        text-anchor="middle"
        fill="#7131cc"
        font-size="34"
        font-weight="900">
    HOW DOES LOOSE SEDIMENT BECOME SOLID ROCK?
  </text>


  <!-- SOURCE ROCK -->

  <g transform="translate(60,155)">

    <polygon points="0,210 60,55 145,15 225,95 250,210"
             fill="#827365"
             stroke="#342b25"
             stroke-width="6"/>

    <path d="M80 70 L110 120 L95 165"
          fill="none"
          stroke="#342b25"
          stroke-width="8"/>

    <path d="M155 55 L140 105 L180 150"
          fill="none"
          stroke="#342b25"
          stroke-width="8"/>

    <text x="125"
          y="255"
          text-anchor="middle"
          fill="#342b25"
          font-size="22"
          font-weight="900">
      ROCK
    </text>

  </g>


  <!-- SEDIMENT -->

  <g fill="#b58a58"
     stroke="#5d4228"
     stroke-width="3">

    <circle cx="390" cy="315" r="18"/>
    <circle cx="430" cy="340" r="14"/>
    <circle cx="465" cy="300" r="20"/>
    <circle cx="505" cy="335" r="17"/>
    <circle cx="540" cy="295" r="13"/>

  </g>


  <text x="465"
        y="390"
        text-anchor="middle"
        fill="#342b25"
        font-size="22"
        font-weight="900">
    LOOSE SEDIMENT
  </text>


  <!-- ARROW -->

  <text x="610"
        y="330"
        text-anchor="middle"
        fill="#7131cc"
        font-size="60"
        font-weight="900">
    →
  </text>


  <!-- LAYERED ROCK -->

  <g transform="translate(710,165)">

    <rect x="0"
          y="0"
          width="390"
          height="65"
          rx="8"
          fill="#d1a56e"
          stroke="#4c3826"
          stroke-width="5"/>

    <rect x="0"
          y="65"
          width="390"
          height="65"
          fill="#b97b50"
          stroke="#4c3826"
          stroke-width="5"/>

    <rect x="0"
          y="130"
          width="390"
          height="65"
          fill="#e0bf86"
          stroke="#4c3826"
          stroke-width="5"/>

    <rect x="0"
          y="195"
          width="390"
          height="65"
          rx="8"
          fill="#9a6949"
          stroke="#4c3826"
          stroke-width="5"/>

    <circle cx="90"
            cy="100"
            r="8"
            fill="#65472f"/>

    <circle cx="210"
            cy="35"
            r="9"
            fill="#65472f"/>

    <circle cx="300"
            cy="165"
            r="7"
            fill="#65472f"/>

    <text x="195"
          y="310"
          text-anchor="middle"
          fill="#342b25"
          font-size="22"
          font-weight="900">
      SEDIMENTARY ROCK
    </text>

  </g>


  <!-- WEDCC BANNER -->

  <rect x="105"
        y="535"
        width="990"
        height="105"
        rx="18"
        fill="#fff3ad"
        stroke="#342b25"
        stroke-width="5"/>


  <text x="600"
        y="575"
        text-anchor="middle"
        fill="#342b25"
        font-size="25"
        font-weight="900">
    THE SECRET CODE:
  </text>


  <text x="600"
        y="615"
        text-anchor="middle"
        fill="#7131cc"
        font-size="31"
        font-weight="900">
    W → E → D → C → C
  </text>

</svg>
