<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 650">

  <rect width="1200"
        height="650"
        rx="24"
        fill="#071120"/>

  <text x="600"
        y="48"
        text-anchor="middle"
        font-size="34"
        font-weight="900"
        fill="#ffffff">
    PHENOMENON MISSION: WHERE DOES EARTH BELONG?
  </text>

  <text x="600"
        y="84"
        text-anchor="middle"
        font-size="20"
        font-weight="700"
        fill="#ccecff">
    Our solar system has an organized pattern.
  </text>


  <!-- SUN -->

  <circle cx="90"
          cy="300"
          r="58"
          fill="#ffd447"
          stroke="#fff3a0"
          stroke-width="8"/>

  <text x="90"
        y="390"
        text-anchor="middle"
        fill="#ffffff"
        font-size="18"
        font-weight="900">
    SUN
  </text>


  <!-- MERCURY -->

  <circle cx="205"
          cy="300"
          r="13"
          fill="#9b9188"/>

  <text x="205"
        y="350"
        text-anchor="middle"
        fill="#ffffff"
        font-size="14"
        font-weight="900">
    MERCURY
  </text>


  <!-- VENUS -->

  <circle cx="300"
          cy="300"
          r="20"
          fill="#d89c4a"/>

  <text x="300"
        y="350"
        text-anchor="middle"
        fill="#ffffff"
        font-size="14"
        font-weight="900">
    VENUS
  </text>


  <!-- EARTH -->

  <circle cx="405"
          cy="300"
          r="22"
          fill="#3d8de8"/>

  <circle cx="397"
          cy="292"
          r="7"
          fill="#55b85c"/>

  <text x="405"
        y="350"
        text-anchor="middle"
        fill="#ffffff"
        font-size="14"
        font-weight="900">
    EARTH
  </text>


  <!-- MARS -->

  <circle cx="510"
          cy="300"
          r="17"
          fill="#c95e3f"/>

  <text x="510"
        y="350"
        text-anchor="middle"
        fill="#ffffff"
        font-size="14"
        font-weight="900">
    MARS
  </text>


  <!-- ASTEROID BELT -->

  <g fill="#b9b6af">

    <circle cx="575" cy="270" r="4"/>
    <circle cx="587" cy="290" r="5"/>
    <circle cx="572" cy="315" r="3"/>
    <circle cx="598" cy="330" r="4"/>
    <circle cx="607" cy="278" r="3"/>
    <circle cx="617" cy="310" r="5"/>
    <circle cx="626" cy="288" r="3"/>

  </g>

  <text x="600"
        y="385"
        text-anchor="middle"
        fill="#ffe45d"
        font-size="14"
        font-weight="900">
    ASTEROID BELT
  </text>


  <!-- JUPITER -->

  <circle cx="705"
          cy="300"
          r="43"
          fill="#c99f7b"/>

  <path d="M667 290 H743"
        stroke="#8c6244"
        stroke-width="6"/>

  <path d="M668 310 H742"
        stroke="#e7c5a5"
        stroke-width="5"/>

  <text x="705"
        y="375"
        text-anchor="middle"
        fill="#ffffff"
        font-size="14"
        font-weight="900">
    JUPITER
  </text>


  <!-- SATURN -->

  <ellipse cx="825"
           cy="300"
           rx="62"
           ry="16"
           fill="none"
           stroke="#d9ca8d"
           stroke-width="7"/>

  <circle cx="825"
          cy="300"
          r="34"
          fill="#dfc779"/>

  <text x="825"
        y="375"
        text-anchor="middle"
        fill="#ffffff"
        font-size="14"
        font-weight="900">
    SATURN
  </text>


  <!-- URANUS -->

  <circle cx="955"
          cy="300"
          r="28"
          fill="#85d6df"/>

  <text x="955"
        y="365"
        text-anchor="middle"
        fill="#ffffff"
        font-size="14"
        font-weight="900">
    URANUS
  </text>


  <!-- NEPTUNE -->

  <circle cx="1070"
          cy="300"
          r="27"
          fill="#426bd7"/>

  <text x="1070"
        y="365"
        text-anchor="middle"
        fill="#ffffff"
        font-size="14"
        font-weight="900">
    NEPTUNE
  </text>


  <rect x="130"
        y="445"
        width="940"
        height="120"
        rx="18"
        fill="#ffffff"
        stroke="#7131cc"
        stroke-width="5"/>

  <text x="600"
        y="485"
        text-anchor="middle"
        fill="#20346f"
        font-size="22"
        font-weight="900">
    MERCURY • VENUS • EARTH • MARS
  </text>

  <text x="600"
        y="520"
        text-anchor="middle"
        fill="#7131cc"
        font-size="19"
        font-weight="900">
    ASTEROID BELT
  </text>

  <text x="600"
        y="552"
        text-anchor="middle"
        fill="#20346f"
        font-size="22"
        font-weight="900">
    JUPITER • SATURN • URANUS • NEPTUNE
  </text>


  <text x="600"
        y="615"
        text-anchor="middle"
        fill="#ffe45d"
        font-size="20"
        font-weight="900">
    MODEL NOT DRAWN TO SCALE
  </text>

</svg>
