<!-- Science Studio Battery Standard Day 50 Phenomenon -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#f6fbff"/>

  <text x="600" y="52" text-anchor="middle" font-family="Arial"
        font-size="38" font-weight="900" fill="#2d2a6e">
    Phenomenon Mission: Where Does the Sound Come From?
  </text>

  <text x="600" y="90" text-anchor="middle" font-family="Arial"
        font-size="22" font-weight="700" fill="#2d2a6e">
    Electrical energy can transform into sound energy.
  </text>

  <rect x="125" y="145" width="950" height="430" rx="28"
        fill="#ffffff" stroke="#d7def7" stroke-width="5"/>

  <!-- battery -->
  <rect x="205" y="370" width="90" height="125" rx="8"
        fill="#ffc400" stroke="#111" stroke-width="5"/>
  <line x1="232" y1="345" x2="232" y2="370" stroke="#111" stroke-width="5"/>
  <line x1="270" y1="330" x2="270" y2="370" stroke="#111" stroke-width="5"/>
  <circle cx="232" cy="345" r="6" fill="#fff" stroke="#111" stroke-width="3"/>
  <circle cx="270" cy="330" r="6" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="214" y="343" font-family="Arial" font-size="20" font-weight="900" fill="#b00020">−</text>
  <text x="279" y="330" font-family="Arial" font-size="20" font-weight="900" fill="#087a35">+</text>
  <text x="250" y="530" text-anchor="middle" font-family="Arial"
        font-size="20" font-weight="900">Battery</text>

  <!-- switch -->
  <rect x="400" y="390" width="135" height="90" rx="12"
        fill="#fff" stroke="#111" stroke-width="5"/>
  <line x1="420" y1="455" x2="510" y2="410"
        stroke="#111" stroke-width="8" stroke-linecap="round"/>
  <circle cx="420" cy="455" r="8" fill="#111"/>
  <circle cx="510" cy="410" r="8" fill="#111"/>
  <text x="468" y="520" text-anchor="middle" font-family="Arial"
        font-size="20" font-weight="900">Closed Switch</text>

  <!-- buzzer/speaker -->
  <rect x="715" y="300" width="150" height="145" rx="26"
        fill="#bfe6ff" stroke="#111" stroke-width="5"/>
  <circle cx="790" cy="372" r="48" fill="#333" stroke="#111" stroke-width="5"/>
  <circle cx="790" cy="372" r="25" fill="#777" stroke="#111" stroke-width="4"/>
  <text x="790" y="485" text-anchor="middle" font-family="Arial"
        font-size="20" font-weight="900">Speaker / Buzzer</text>

  <!-- sound waves -->
  <path d="M870 330 C920 350 920 395 870 415"
        fill="none" stroke="#c2185b" stroke-width="9"/>
  <path d="M900 300 C985 335 985 410 900 445"
        fill="none" stroke="#c2185b" stroke-width="9"/>
  <path d="M930 270 C1050 320 1050 425 930 475"
        fill="none" stroke="#c2185b" stroke-width="9"/>

  <!-- wires -->
  <path d="M270 330 L270 230 L715 230 L715 350"
        stroke="#f08a24" stroke-width="10" fill="none"/>
  <path d="M715 395 L535 435"
        stroke="#f08a24" stroke-width="10" fill="none"/>
  <path d="M400 435 L330 435 L330 345 L232 345"
        stroke="#f08a24" stroke-width="10" fill="none"/>

  <rect x="165" y="110" width="250" height="52" rx="14"
        fill="#fff7d6" stroke="#111" stroke-width="3"/>
  <text x="290" y="143" text-anchor="middle" font-family="Arial"
        font-size="18" font-weight="900">Battery: energy source</text>

  <rect x="460" y="110" width="270" height="52" rx="14"
        fill="#ede9ff" stroke="#111" stroke-width="3"/>
  <text x="595" y="143" text-anchor="middle" font-family="Arial"
        font-size="18" font-weight="900">Closed path: energy flows</text>

  <rect x="770" y="110" width="270" height="52" rx="14"
        fill="#eaf7ed" stroke="#111" stroke-width="3"/>
  <text x="905" y="143" text-anchor="middle" font-family="Arial"
        font-size="18" font-weight="900">Speaker output: sound</text>

  <rect x="230" y="610" width="740" height="52" rx="16"
        fill="#fff7d6" stroke="#2d2a6e" stroke-width="3"/>
  <text x="600" y="643" text-anchor="middle" font-family="Arial"
        font-size="20" font-weight="900" fill="#2d2a6e">
    Focus Question: How does electrical energy become sound energy?
  </text>
</svg>
