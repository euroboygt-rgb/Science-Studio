<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1100 650">

  <rect width="1100"
        height="650"
        rx="24"
        fill="#f5faff"/>

  <text x="550"
        y="48"
        text-anchor="middle"
        font-size="34"
        font-weight="900"
        fill="#20346f">
    PHENOMENON MISSION: ONE BULB IS REMOVED
  </text>

  <text x="550"
        y="82"
        text-anchor="middle"
        font-size="19"
        font-weight="700"
        fill="#20346f">
    Why does the other bulb go out too?
  </text>


  <rect x="65"
        y="115"
        width="970"
        height="405"
        rx="24"
        fill="#ffffff"
        stroke="#cad7ef"
        stroke-width="4"/>


  <!-- Battery -->

  <rect x="120"
        y="260"
        width="76"
        height="125"
        rx="10"
        fill="#ffc400"
        stroke="#111111"
        stroke-width="5"/>

  <circle cx="158"
          cy="242"
          r="10"
          fill="#d9ffdf"
          stroke="#16823b"
          stroke-width="5"/>

  <circle cx="158"
          cy="404"
          r="10"
          fill="#ffdfe2"
          stroke="#b00020"
          stroke-width="5"/>

  <text x="180"
        y="244"
        font-size="24"
        font-weight="900"
        fill="#16823b">+</text>

  <text x="180"
        y="419"
        font-size="24"
        font-weight="900"
        fill="#b00020">−</text>

  <text x="158"
        y="330"
        text-anchor="middle"
        font-size="15"
        font-weight="900">
    BATTERY
  </text>


  <!-- Wire to bulb 1 -->

  <path d="M158 242
           C250 165 320 175 380 235"
        fill="none"
        stroke="#f0831e"
        stroke-width="9"
        stroke-linecap="round"/>


  <!-- Bulb 1 -->

  <circle cx="410"
          cy="285"
          r="52"
          fill="#eeeeee"
          stroke="#555555"
          stroke-width="5"/>

  <circle cx="410"
          cy="285"
          r="25"
          fill="#ffffff"
          stroke="#777777"
          stroke-width="4"/>

  <rect x="387"
        y="332"
        width="46"
        height="28"
        rx="4"
        fill="#f0831e"
        stroke="#111111"
        stroke-width="4"/>

  <text x="410"
        y="395"
        text-anchor="middle"
        font-size="17"
        font-weight="900">
    BULB OFF
  </text>


  <!-- wire after bulb 1 -->

  <path d="M435 345
           C490 398 530 400 575 360"
        fill="none"
        stroke="#7131cc"
        stroke-width="9"
        stroke-linecap="round"/>


  <!-- GAP -->

  <line x1="575"
        y1="360"
        x2="625"
        y2="330"
        stroke="#d7263d"
        stroke-width="8"
        stroke-linecap="round"/>

  <line x1="655"
        y1="330"
        x2="705"
        y2="360"
        stroke="#d7263d"
        stroke-width="8"
        stroke-linecap="round"/>

  <circle cx="640"
          cy="335"
          r="38"
          fill="#ffe5e8"
          stroke="#d7263d"
          stroke-width="4"/>

  <text x="640"
        y="344"
        text-anchor="middle"
        font-size="28"
        font-weight="900"
        fill="#b00020">
    ?
  </text>

  <text x="640"
        y="410"
        text-anchor="middle"
        font-size="21"
        font-weight="900"
        fill="#b00020">
    GAP
  </text>


  <!-- ghost removed bulb -->

  <g opacity=".45"
     transform="translate(760,285)">

    <circle cx="0"
            cy="0"
            r="52"
            fill="#ffffff"
            stroke="#999999"
            stroke-width="5"
            stroke-dasharray="12 8"/>

    <circle cx="0"
            cy="0"
            r="25"
            fill="#ffffff"
            stroke="#999999"
            stroke-width="4"/>

    <rect x="-23"
          y="47"
          width="46"
          height="28"
          rx="4"
          fill="#dddddd"
          stroke="#777777"
          stroke-width="4"/>

  </g>

  <text x="760"
        y="395"
        text-anchor="middle"
        font-size="17"
        font-weight="900"
        fill="#777777">
    BULB REMOVED
  </text>


  <!-- return wire -->

  <path d="M815 360
           C900 435 875 470 740 470
           L350 470
           C245 465 185 440 158 404"
        fill="none"
        stroke="#1681ee"
        stroke-width="9"
        stroke-linecap="round"
        stroke-dasharray="15 12"/>


  <rect x="300"
        y="135"
        width="500"
        height="58"
        rx="12"
        fill="#ffe5e8"
        stroke="#d7263d"
        stroke-width="3"/>

  <text x="550"
        y="171"
        text-anchor="middle"
        font-size="21"
        font-weight="900"
        fill="#b00020">
    ONE PATH + ONE GAP = INCOMPLETE CIRCUIT
  </text>


  <rect x="155"
        y="550"
        width="790"
        height="65"
        rx="14"
        fill="#fff4a8"
        stroke="#24336b"
        stroke-width="3"/>

  <text x="550"
        y="577"
        text-anchor="middle"
        font-size="18"
        font-weight="900"
        fill="#24336b">
    FOCUS QUESTION
  </text>

  <text x="550"
        y="604"
        text-anchor="middle"
        font-size="20"
        font-weight="900"
        fill="#24336b">
    Why can't electrical energy reach the remaining bulb?
  </text>

</svg>
