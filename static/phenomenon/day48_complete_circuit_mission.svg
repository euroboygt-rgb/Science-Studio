<!-- Science Studio Battery Standard Day 48 Phenomenon -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#f6fbff"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="38" font-weight="900" fill="#2d2a6e">Phenomenon Mission: Will the Bulb Light?</text>
  <text x="600" y="88" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#2d2a6e">Compare the circuits. Which one has a complete path?</text>

  <!-- Circuit A -->
  <rect x="90" y="145" width="470" height="420" rx="24" fill="#ffffff" stroke="#d7def7" stroke-width="5"/>
  <text x="325" y="190" text-anchor="middle" font-family="Arial" font-size="30" font-weight="900" fill="#2d2a6e">Circuit A</text>
  <text x="325" y="222" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">Switch is OPEN</text>

  <rect x="155" y="390" width="70" height="110" rx="8" fill="#ffc400" stroke="#111" stroke-width="5"/>
  <line x1="175" y1="375" x2="175" y2="390" stroke="#111" stroke-width="6"/>
  <line x1="205" y1="365" x2="205" y2="390" stroke="#111" stroke-width="6"/>
  <circle cx="175" cy="375" r="6" fill="#fff" stroke="#111" stroke-width="3"/>
  <circle cx="205" cy="365" r="6" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="158" y="373" font-family="Arial" font-size="20" font-weight="900" fill="#b00020">−</text>
  <text x="214" y="365" font-family="Arial" font-size="20" font-weight="900" fill="#087a35">+</text>
  <text x="190" y="530" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Battery</text>

  <circle cx="425" cy="295" r="45" fill="#eeeeee" stroke="#111" stroke-width="5"/>
  <text x="425" y="360" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Bulb OFF</text>

  <path d="M205 365 L205 295 L380 295" stroke="#f08a24" stroke-width="10" fill="none"/>
  <path d="M470 295 L510 295 L510 445 L355 445" stroke="#f08a24" stroke-width="10" fill="none"/>
  <path d="M175 375 L135 375 L135 445 L300 445" stroke="#f08a24" stroke-width="10" fill="none" stroke-linecap="round"/>
  <line x1="300" y1="445" x2="350" y2="410" stroke="#111" stroke-width="10" stroke-linecap="round"/>
  <circle cx="300" cy="445" r="8" fill="#111"/>
  <circle cx="355" cy="445" r="8" fill="#111"/>
  <text x="325" y="602" text-anchor="middle" font-family="Arial" font-size="22" font-weight="900" fill="#b00020">Open path = bulb does not light</text>

  <!-- Circuit B -->
  <rect x="640" y="145" width="470" height="420" rx="24" fill="#ffffff" stroke="#d7def7" stroke-width="5"/>
  <text x="875" y="190" text-anchor="middle" font-family="Arial" font-size="30" font-weight="900" fill="#2d2a6e">Circuit B</text>
  <text x="875" y="222" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">Switch is CLOSED</text>

  <rect x="705" y="390" width="70" height="110" rx="8" fill="#ffc400" stroke="#111" stroke-width="5"/>
  <line x1="725" y1="375" x2="725" y2="390" stroke="#111" stroke-width="6"/>
  <line x1="755" y1="365" x2="755" y2="390" stroke="#111" stroke-width="6"/>
  <circle cx="725" cy="375" r="6" fill="#fff" stroke="#111" stroke-width="3"/>
  <circle cx="755" cy="365" r="6" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="708" y="373" font-family="Arial" font-size="20" font-weight="900" fill="#b00020">−</text>
  <text x="764" y="365" font-family="Arial" font-size="20" font-weight="900" fill="#087a35">+</text>
  <text x="740" y="530" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Battery</text>

  <circle cx="975" cy="295" r="45" fill="#fff7a6" stroke="#111" stroke-width="5"/>
  <path d="M1017 250 L1065 215 M1028 295 L1090 295 M1017 340 L1065 375" stroke="#ffc400" stroke-width="10" stroke-linecap="round"/>
  <text x="975" y="360" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Bulb ON</text>

  <path d="M755 365 L755 295 L930 295" stroke="#f08a24" stroke-width="10" fill="none"/>
  <path d="M1020 295 L1060 295 L1060 445 L905 445" stroke="#f08a24" stroke-width="10" fill="none"/>
  <path d="M725 375 L665 375 L665 445 L850 445" stroke="#f08a24" stroke-width="10" fill="none" stroke-linecap="round"/>
  <line x1="850" y1="445" x2="905" y2="445" stroke="#111" stroke-width="10" stroke-linecap="round"/>
  <circle cx="850" cy="445" r="8" fill="#111"/>
  <circle cx="905" cy="445" r="8" fill="#111"/>
  <text x="875" y="602" text-anchor="middle" font-family="Arial" font-size="22" font-weight="900" fill="#087a35">Closed path = bulb lights</text>

  <rect x="250" y="620" width="700" height="48" rx="16" fill="#ede9ff" stroke="#2d2a6e" stroke-width="3"/>
  <text x="600" y="651" text-anchor="middle" font-family="Arial" font-size="20" font-weight="900" fill="#2d2a6e">A functioning circuit needs a complete closed path for electrical energy to flow.</text>
</svg>
