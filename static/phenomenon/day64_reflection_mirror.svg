<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1100 650">

  <rect width="1100"
        height="650"
        rx="24"
        fill="#f6fbff"/>

  <text x="550"
        y="48"
        text-anchor="middle"
        font-size="34"
        font-weight="900"
        fill="#20346f">
    PHENOMENON MISSION: WHERE DID THE LIGHT GO?
  </text>

  <text x="550"
        y="82"
        text-anchor="middle"
        font-size="20"
        font-weight="700"
        fill="#20346f">
    Follow the light before and after it strikes the mirror.
  </text>


  <rect x="65"
        y="120"
        width="970"
        height="400"
        rx="24"
        fill="#ffffff"
        stroke="#cad7ef"
        stroke-width="4"/>


  <!-- flashlight -->

  <rect x="100"
        y="315"
        width="145"
        height="74"
        rx="18"
        fill="#7131cc"
        stroke="#111"
        stroke-width="5"/>

  <rect x="215"
        y="292"
        width="70"
        height="120"
        rx="12"
        fill="#9d70df"
        stroke="#111"
        stroke-width="5"/>

  <circle cx="286"
          cy="352"
          r="40"
          fill="#fff3a0"
          stroke="#111"
          stroke-width="5"/>


  <!-- incoming ray -->

  <line x1="330"
        y1="350"
        x2="555"
        y2="350"
        stroke="#ffe45d"
        stroke-width="18"
        stroke-linecap="round"/>

  <line x1="330"
        y1="350"
        x2="555"
        y2="350"
        stroke="#fff9c9"
        stroke-width="7"
        stroke-linecap="round"/>


  <!-- mirror -->

  <g transform="translate(575,350) rotate(-45)">

    <rect x="-12"
          y="-105"
          width="24"
          height="210"
          rx="6"
          fill="#dff6ff"
          stroke="#111"
          stroke-width="5"/>

    <line x1="-2"
          y1="-90"
          x2="-2"
          y2="90"
          stroke="#ffffff"
          stroke-width="5"/>

  </g>


  <!-- reflected ray -->

  <line x1="590"
        y1="334"
        x2="590"
        y2="160"
        stroke="#ffe45d"
        stroke-width="18"
        stroke-linecap="round"/>

  <line x1="590"
        y1="334"
        x2="590"
        y2="160"
        stroke="#fff9c9"
        stroke-width="7"
        stroke-linecap="round"/>


  <!-- target -->

  <circle cx="590"
          cy="155"
          r="55"
          fill="#fff4a8"
          stroke="#d69f00"
          stroke-width="5"/>

  <circle cx="590"
          cy="155"
          r="30"
          fill="#ffe45d"/>

  <circle cx="590"
          cy="155"
          r="12"
          fill="#f0831e"/>


  <!-- labels -->

  <rect x="335"
        y="390"
        width="210"
        height="52"
        rx="12"
        fill="#e8f7ff"
        stroke="#20346f"
        stroke-width="3"/>

  <text x="440"
        y="423"
        text-anchor="middle"
        font-size="19"
        font-weight="900"
        fill="#20346f">
    INCOMING RAY
  </text>


  <rect x="625"
        y="220"
        width="210"
        height="52"
        rx="12"
        fill="#e7ddff"
        stroke="#7131cc"
        stroke-width="3"/>

  <text x="730"
        y="253"
        text-anchor="middle"
        font-size="19"
        font-weight="900"
        fill="#402080">
    REFLECTED RAY
  </text>


  <text x="660"
        y="380"
        font-size="20"
        font-weight="900">
    MIRROR
  </text>


  <rect x="150"
        y="555"
        width="800"
        height="65"
        rx="14"
        fill="#fff4a8"
        stroke="#24336b"
        stroke-width="3"/>

  <text x="550"
        y="582"
        text-anchor="middle"
        font-size="18"
        font-weight="900"
        fill="#24336b">
    FOCUS QUESTION
  </text>

  <text x="550"
        y="608"
        text-anchor="middle"
        font-size="20"
        font-weight="900"
        fill="#24336b">
    What caused the light to change direction?
  </text>

</svg>
