  <g transform="translate(655,570)">

    <rect x="0"
          y="0"
          width="355"
          height="70"
          rx="18"
          fill="#252525"
          stroke="#ffe66d"
          stroke-width="5"/>


    <text x="177"
          y="30"
          text-anchor="middle"
          fill="#ffffff"
          font-size="22"
          font-weight="900">
      🛢 PETROLEUM
