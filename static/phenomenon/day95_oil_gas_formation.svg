  </text>


  <!-- BURIAL -->

  <rect x="90"
        y="385"
        width="1020"
        height="55"
        fill="#d7ae70"
        stroke="#4c3728"
        stroke-width="4"/>

  <rect x="90"
        y="440"
        width="1020"
        height="55"
        fill="#b97e57"
        stroke="#4c3728"
        stroke-width="4"/>

  <rect x="90"
        y="495"
        width="1020"
        height="55"
        fill="#9c6b51"
        stroke="#4c3728"
        stroke-width="4"/>


  <text x="220"
        y="530"
        text-anchor="middle"
        fill="#ffe66d"
        font-size="22"
        font-weight="900">
