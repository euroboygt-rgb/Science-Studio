<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 700">

  <defs>

    <linearGradient id="water"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="1">

      <stop offset="0%"
            stop-color="#4bb9df"/>

      <stop offset="100%"
            stop-color="#164f85"/>

    </linearGradient>

    <linearGradient id="earth"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="1">

      <stop offset="0%"
            stop-color="#c59a63"/>

      <stop offset="100%"
            stop-color="#4b342a"/>

    </linearGradient>

  </defs>


  <rect width="1200"
        height="700"
        rx="26"
        fill="#e8f8ff"/>


  <text x="600"
        y="48"
        text-anchor="middle"
        fill="#2c2521"
        font-size="30"
        font-weight="900">
    OIL &amp; NATURAL GAS FORMATION
  </text>


  <text x="600"
        y="88"
        text-anchor="middle"
        fill="#7131cc"
        font-size="32"
        font-weight="900">
    WHAT IS HIDDEN BENEATH THE ANCIENT SEA?
  </text>


  <!-- WATER -->

  <rect x="0"
        y="120"
        width="1200"
        height="190"
        fill="url(#water)"/>


  <text x="600"
        y="155"
        text-anchor="middle"
        fill="#ffffff"
        font-size="22"
        font-weight="900">
    ANCIENT AQUATIC ENVIRONMENT
  </text>


  <g font-size="42">

    <text x="150"
          y="215">
      🦠
    </text>

    <text x="300"
          y="190">
      🦠
    </text>

    <text x="475"
          y="230">
      🦠
    </text>

    <text x="700"
          y="195">
      🦠
    </text>

    <text x="880"
          y="225">
      🦠
    </text>

    <text x="1030"
          y="190">
      🦠
    </text>

  </g>


  <text x="600"
        y="275"
        text-anchor="middle"
        fill="#dff8ff"
        font-size="20"
        font-weight="900">
