  </text>


  <!-- EARTH -->

  <rect x="0"
        y="310"
        width="1200"
        height="390"
        fill="url(#earth)"/>


  <!-- SOURCE MATERIAL -->

  <rect x="90"
        y="325"
        width="1020"
        height="60"
        rx="8"
        fill="#4b4036"
        stroke="#2c211c"
        stroke-width="4"/>


  <text x="600"
        y="362"
        text-anchor="middle"
        fill="#ffe66d"
        font-size="21"
        font-weight="900">
