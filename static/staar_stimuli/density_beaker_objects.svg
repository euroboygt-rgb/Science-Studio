<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-label="A beaker of water with objects floating, sinking, and suspended">
  <rect width="900" height="620" fill="#ffffff"/>
  <text x="450" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="800">Objects in Water</text>

  <ellipse cx="450" cy="120" rx="190" ry="38" fill="#ffffff" stroke="#111" stroke-width="5"/>
  <path d="M260 120 L315 500 Q450 545 585 500 L640 120" fill="#eef9ff" stroke="#111" stroke-width="5"/>
  <path d="M292 210 Q450 235 608 210 L585 500 Q450 540 315 500 Z" fill="#bcd7e6" opacity="0.65"/>
  <ellipse cx="450" cy="210" rx="158" ry="26" fill="#9fc3d4" opacity="0.75" stroke="#5f7d8b" stroke-width="2"/>

  <circle cx="365" cy="208" r="34" fill="#7a7a7a" stroke="#111" stroke-width="4"/>
  <ellipse cx="352" cy="198" rx="20" ry="8" fill="#bbbbbb" opacity="0.9"/>
  <text x="365" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="800">1</text>

  <circle cx="502" cy="210" r="15" fill="#555" stroke="#111" stroke-width="4"/>
  <text x="502" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="800">4</text>

  <ellipse cx="385" cy="448" rx="28" ry="42" fill="#f6f6f6" stroke="#111" stroke-width="4"/>
  <ellipse cx="374" cy="432" rx="12" ry="19" fill="#ffffff"/>
  <text x="385" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="800">2</text>

  <polygon points="450,450 470,496 430,496" fill="#9a9a9a" stroke="#111" stroke-width="4"/>
  <line x1="450" y1="450" x2="450" y2="496" stroke="#444" stroke-width="3"/>
  <text x="450" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="800">3</text>

  <rect x="520" y="275" width="55" height="115" fill="#333" stroke="#111" stroke-width="4"/>
  <polygon points="520,275 545,260 575,275 550,290" fill="#555" stroke="#111" stroke-width="4"/>
  <polygon points="575,275 575,390 550,405 550,290" fill="#222" stroke="#111" stroke-width="3"/>
  <text x="548" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="800">5</text>

  <line x1="292" y1="210" x2="608" y2="210" stroke="#3a7088" stroke-width="3" opacity="0.8"/>
  <text x="450" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">Float = less dense • Sink = more dense • Suspended = about same density</text>
</svg>
