<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 620" role="img" aria-label="A magnet investigation table with magnets placed at different distances from steel paper clips">
  <rect width="950" height="620" fill="#ffffff"/>
  <text x="475" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="800">Magnet Strength Investigation</text>

  <rect x="85" y="95" width="780" height="260" fill="#fff7d6" stroke="#111" stroke-width="5"/>
  <line x1="85" y1="155" x2="865" y2="155" stroke="#111" stroke-width="4"/>
  <line x1="220" y1="95" x2="220" y2="355" stroke="#111" stroke-width="4"/>
  <line x1="575" y1="95" x2="575" y2="355" stroke="#111" stroke-width="4"/>
  <line x1="85" y1="222" x2="865" y2="222" stroke="#111" stroke-width="3"/>
  <line x1="85" y1="289" x2="865" y2="289" stroke="#111" stroke-width="3"/>

  <text x="152" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="800">Magnet</text>
  <text x="398" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="800">Distance from Clips</text>
  <text x="720" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="800">Clips Attracted</text>

  <text x="152" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800">1</text>
  <text x="398" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="22">15 cm</text>

  <text x="152" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800">2</text>
  <text x="398" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="22">30 cm</text>

  <text x="152" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800">3</text>
  <text x="398" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="22">45 cm</text>

  <g transform="translate(150 430)">
    <path d="M0 0 h90 v60 h-90 z" fill="#d62828" stroke="#111" stroke-width="4"/>
    <path d="M90 0 h90 v60 h-90 z" fill="#1d4ed8" stroke="#111" stroke-width="4"/>
    <text x="45" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="white" font-weight="800">N</text>
    <text x="135" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="white" font-weight="800">S</text>
  </g>

  <g transform="translate(560 438)" fill="none" stroke="#111" stroke-width="5">
    <path d="M0 0 q20 30 40 0 q20 30 40 0 q20 30 40 0"/>
    <path d="M0 35 q20 30 40 0 q20 30 40 0 q20 30 40 0"/>
  </g>

  <text x="475" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800">Fair test question: What should stay the same?</text>
</svg>
