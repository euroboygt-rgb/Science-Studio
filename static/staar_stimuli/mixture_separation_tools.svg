<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 600" role="img" aria-label="Mixture separation tools including magnet, screen, filter, and hot plate">
  <rect width="950" height="600" fill="#ffffff"/>
  <text x="475" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="800">Separating a Mixture</text>
  <text x="475" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700">Mixture: gravel + iron filings + water</text>

  <rect x="70" y="130" width="180" height="210" rx="20" fill="#fff7d6" stroke="#111" stroke-width="5"/>
  <path d="M105 185 h90 v40 h-90 z" fill="#d62828" stroke="#111" stroke-width="4"/>
  <path d="M195 185 h20 v40 h-20 z" fill="#1d4ed8" stroke="#111" stroke-width="4"/>
  <text x="160" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800">Magnet</text>

  <rect x="285" y="130" width="180" height="210" rx="20" fill="#fff7d6" stroke="#111" stroke-width="5"/>
  <rect x="330" y="175" width="90" height="90" fill="#e0e0e0" stroke="#111" stroke-width="4"/>
  <g stroke="#777" stroke-width="2">
    <line x1="345" y1="175" x2="345" y2="265"/><line x1="365" y1="175" x2="365" y2="265"/><line x1="385" y1="175" x2="385" y2="265"/><line x1="405" y1="175" x2="405" y2="265"/>
    <line x1="330" y1="195" x2="420" y2="195"/><line x1="330" y1="215" x2="420" y2="215"/><line x1="330" y1="235" x2="420" y2="235"/><line x1="330" y1="255" x2="420" y2="255"/>
  </g>
  <text x="375" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800">Screen</text>

  <rect x="500" y="130" width="180" height="210" rx="20" fill="#fff7d6" stroke="#111" stroke-width="5"/>
  <path d="M550 175 h80 l-25 70 v40 h-30 v-40 z" fill="#ffffff" stroke="#111" stroke-width="4"/>
  <path d="M560 210 h60" stroke="#8ecae6" stroke-width="9"/>
  <text x="590" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800">Filter</text>

  <rect x="715" y="130" width="180" height="210" rx="20" fill="#fff7d6" stroke="#111" stroke-width="5"/>
  <rect x="760" y="250" width="90" height="45" rx="10" fill="#444" stroke="#111" stroke-width="4"/>
  <circle cx="790" cy="272" r="8" fill="#ff9f1c"/>
  <circle cx="825" cy="272" r="8" fill="#ff9f1c"/>
  <path d="M775 185 c25 -35 55 -35 80 0" fill="none" stroke="#d62828" stroke-width="8"/>
  <text x="805" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800">Hot plate</text>

  <rect x="200" y="460" width="550" height="60" rx="20" fill="#d8f3dc" stroke="#111" stroke-width="4"/>
  <text x="475" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800">Which tool separates each material by its physical property?</text>
</svg>
