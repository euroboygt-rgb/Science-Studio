<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 590" role="img" aria-label="A temperature data table for cups made of different materials">
  <rect width="950" height="590" fill="#ffffff"/>
  <text x="475" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="800">Thermal Energy Investigation</text>
  <text x="475" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700">Warm water is poured into cups made of different materials.</text>

  <rect x="90" y="120" width="770" height="330" fill="#fff7d6" stroke="#111" stroke-width="5"/>
  <line x1="90" y1="185" x2="860" y2="185" stroke="#111" stroke-width="4"/>
  <line x1="240" y1="120" x2="240" y2="450" stroke="#111" stroke-width="4"/>
  <line x1="410" y1="120" x2="410" y2="450" stroke="#111" stroke-width="4"/>
  <line x1="580" y1="120" x2="580" y2="450" stroke="#111" stroke-width="4"/>
  <line x1="720" y1="120" x2="720" y2="450" stroke="#111" stroke-width="4"/>

  <line x1="90" y1="250" x2="860" y2="250" stroke="#111" stroke-width="3"/>
  <line x1="90" y1="315" x2="860" y2="315" stroke="#111" stroke-width="3"/>
  <line x1="90" y1="380" x2="860" y2="380" stroke="#111" stroke-width="3"/>

  <g font-family="Arial, sans-serif" font-size="20" font-weight="800">
    <text x="165" y="160" text-anchor="middle">Cup</text>
    <text x="325" y="160" text-anchor="middle">Start</text>
    <text x="495" y="160" text-anchor="middle">2 min</text>
    <text x="650" y="160" text-anchor="middle">5 min</text>
    <text x="790" y="160" text-anchor="middle">8 min</text>

    <text x="165" y="225" text-anchor="middle">Foam</text>
    <text x="325" y="225" text-anchor="middle">90°C</text>
    <text x="495" y="225" text-anchor="middle">88°C</text>
    <text x="650" y="225" text-anchor="middle">86°C</text>
    <text x="790" y="225" text-anchor="middle">84°C</text>

    <text x="165" y="290" text-anchor="middle">Plastic</text>
    <text x="325" y="290" text-anchor="middle">90°C</text>
    <text x="495" y="290" text-anchor="middle">82°C</text>
    <text x="650" y="290" text-anchor="middle">76°C</text>
    <text x="790" y="290" text-anchor="middle">70°C</text>

    <text x="165" y="355" text-anchor="middle">Metal</text>
    <text x="325" y="355" text-anchor="middle">90°C</text>
    <text x="495" y="355" text-anchor="middle">70°C</text>
    <text x="650" y="355" text-anchor="middle">62°C</text>
    <text x="790" y="355" text-anchor="middle">55°C</text>

    <text x="165" y="420" text-anchor="middle">Paper</text>
    <text x="325" y="420" text-anchor="middle">90°C</text>
    <text x="495" y="420" text-anchor="middle">84°C</text>
    <text x="650" y="420" text-anchor="middle">80°C</text>
    <text x="790" y="420" text-anchor="middle">76°C</text>
  </g>

  <text x="475" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800">Which material kept the water warm the longest?</text>
</svg>
