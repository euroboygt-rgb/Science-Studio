<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Sugar is added to water and dissolves into a clear solution">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="800">Sugar + Water Investigation</text>

  <rect x="92" y="120" width="210" height="280" rx="28" fill="#eef9ff" stroke="#111" stroke-width="5"/>
  <path d="M105 245 Q197 275 289 245 L289 385 Q197 420 105 385 Z" fill="#bcd7e6" opacity="0.75"/>
  <text x="197" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800">500 mL water</text>

  <rect x="355" y="145" width="130" height="105" rx="12" fill="#fff5d6" stroke="#111" stroke-width="5"/>
  <circle cx="392" cy="178" r="8" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
  <circle cx="430" cy="196" r="8" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
  <circle cx="452" cy="172" r="8" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
  <text x="420" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800">10 g sugar</text>

  <path d="M510 210 C570 210 590 250 640 250" fill="none" stroke="#111" stroke-width="5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#111"/>
    </marker>
  </defs>

  <rect x="645" y="120" width="210" height="280" rx="28" fill="#eef9ff" stroke="#111" stroke-width="5"/>
  <path d="M658 245 Q750 275 842 245 L842 385 Q750 420 658 385 Z" fill="#bcd7e6" opacity="0.45"/>
  <circle cx="715" cy="298" r="5" fill="#ffffff" opacity="0.5"/>
  <circle cx="770" cy="330" r="5" fill="#ffffff" opacity="0.5"/>
  <circle cx="805" cy="288" r="5" fill="#ffffff" opacity="0.5"/>
  <text x="750" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800">clear solution</text>

  <text x="450" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">Dissolving is not melting. The sugar spreads through the water.</text>
</svg>
