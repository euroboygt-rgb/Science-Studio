<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-label="CMELTS Forms of Energy anchor chart">
  <rect width="1200" height="1600" fill="#ffffff"/>
  <style>
    .title{font-family:Arial,sans-serif;font-size:82px;font-weight:900;fill:#6f2dbd}
    .subtitle{font-family:Arial,sans-serif;font-size:34px;font-weight:900;fill:#111}
    .letter{font-family:Arial,sans-serif;font-size:58px;font-weight:900}
    .head{font-family:Arial,sans-serif;font-size:34px;font-weight:900}
    .text{font-family:Arial,sans-serif;font-size:23px;font-weight:800;fill:#111}
    .box{stroke:#111;stroke-width:6;rx:30}
    .art{opacity:.24}
  </style>

  <text x="600" y="95" text-anchor="middle" class="title">Forms of Energy</text>
  <path d="M230 135 Q600 180 970 135" fill="none" stroke="#00a6d6" stroke-width="10"/>
  <text x="600" y="210" text-anchor="middle" class="subtitle">Remember the forms of energy with CMELTS.</text>

  <g>
    <rect class="box" x="75" y="285" width="500" height="255" fill="#fff7ed"/>
    <g class="art"><rect x="405" y="385" width="55" height="100" rx="12" fill="#9ca3af" stroke="#111" stroke-width="6"/><circle cx="500" cy="430" r="42" fill="#fde047" stroke="#111" stroke-width="6"/></g>
    <text x="120" y="365" class="letter" fill="#ea580c">C</text>
    <text x="210" y="360" class="head" fill="#ea580c">Chemical</text>
    <text x="210" y="415" class="text">stored energy in food, fuel,</text>
    <text x="210" y="452" class="text">batteries, and living things</text>

    <rect class="box" x="625" y="285" width="500" height="255" fill="#f0fdf4"/>
    <g class="art"><rect x="960" y="395" width="120" height="75" fill="#a16207" stroke="#111" stroke-width="6"/><line x1="840" y1="432" x2="975" y2="432" stroke="#7e22ce" stroke-width="12"/><polygon points="975,397 1025,432 975,467" fill="#7e22ce" stroke="#111" stroke-width="5"/></g>
    <text x="670" y="365" class="letter" fill="#16a34a">M</text>
    <text x="760" y="360" class="head" fill="#16a34a">Mechanical</text>
    <text x="760" y="415" class="text">energy of motion, position,</text>
    <text x="760" y="452" class="text">pushes, pulls, and moving parts</text>

    <rect class="box" x="75" y="585" width="500" height="255" fill="#eff6ff"/>
    <g class="art"><rect x="405" y="685" width="55" height="100" rx="12" fill="#9ca3af" stroke="#111" stroke-width="6"/><circle cx="500" cy="730" r="42" fill="#fde047" stroke="#111" stroke-width="6"/><path d="M455 735 C485 670 535 670 565 735" fill="none" stroke="#0284c7" stroke-width="10"/></g>
    <text x="120" y="665" class="letter" fill="#2563eb">E</text>
    <text x="210" y="660" class="head" fill="#2563eb">Electrical</text>
    <text x="210" y="715" class="text">energy moving through</text>
    <text x="210" y="752" class="text">a closed circuit</text>

    <rect class="box" x="625" y="585" width="500" height="255" fill="#fff1f2"/>
    <g class="art"><circle cx="980" cy="710" r="42" fill="#fde047" stroke="#111" stroke-width="6"/><line x1="980" y1="630" x2="980" y2="575" stroke="#f59e0b" stroke-width="9"/><line x1="980" y1="790" x2="980" y2="845" stroke="#f59e0b" stroke-width="9"/><line x1="900" y1="710" x2="845" y2="710" stroke="#f59e0b" stroke-width="9"/><line x1="1060" y1="710" x2="1115" y2="710" stroke="#f59e0b" stroke-width="9"/></g>
    <text x="670" y="665" class="letter" fill="#dc2626">L</text>
    <text x="760" y="660" class="head" fill="#dc2626">Light</text>
    <text x="760" y="715" class="text">energy we can see</text>

    <rect class="box" x="75" y="885" width="500" height="255" fill="#faf5ff"/>
    <g class="art"><ellipse cx="455" cy="1015" rx="100" ry="32" fill="#bfdbfe" stroke="#111" stroke-width="6"/><rect x="375" y="1050" width="165" height="60" rx="12" fill="#333" stroke="#111" stroke-width="6"/><path d="M395 960 q-15 -38 15 -72 M455 960 q-15 -38 15 -72 M515 960 q-15 -38 15 -72" fill="none" stroke="#0284c7" stroke-width="6"/></g>
    <text x="120" y="965" class="letter" fill="#7e22ce">T</text>
    <text x="210" y="960" class="head" fill="#7e22ce">Thermal</text>
    <text x="210" y="1015" class="text">heat energy from</text>
    <text x="210" y="1052" class="text">moving particles</text>

    <rect class="box" x="625" y="885" width="500" height="255" fill="#f0fdfa"/>
    <g class="art"><rect x="940" y="985" width="110" height="120" rx="12" fill="#bfdbfe" stroke="#111" stroke-width="6"/><path d="M940 1045 q55 25 110 0 v60 h-110z" fill="#60a5fa"/><path d="M820 1040 q80 -55 160 0 M820 1090 q80 -55 160 0" fill="none" stroke="#0f766e" stroke-width="8"/></g>
    <text x="670" y="965" class="letter" fill="#0f766e">S</text>
    <text x="760" y="960" class="head" fill="#0f766e">Sound</text>
    <text x="760" y="1015" class="text">energy we hear</text>
    <text x="760" y="1052" class="text">from vibrations</text>
  </g>

  <rect x="120" y="1240" width="960" height="185" rx="36" fill="#fff7d6" stroke="#111" stroke-width="6"/>
  <text x="600" y="1310" text-anchor="middle" class="head" fill="#6f2dbd">Energy Transformation</text>
  <text x="600" y="1365" text-anchor="middle" class="subtitle">Energy can change from one form to another.</text>
  <text x="600" y="1410" text-anchor="middle" class="text">Battery → electrical energy → light and thermal energy</text>
</svg>
