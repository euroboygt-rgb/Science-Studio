<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
<rect width="900" height="600" rx="24" fill="white"/>
<rect x="20" y="20" width="860" height="560" rx="22" fill="#f8f9fa" stroke="#111" stroke-width="5"/>
<text x="450" y="65" text-anchor="middle" font-size="38" font-weight="bold" font-family="Arial">Fair Test to Data</text>
<text x="450" y="105" text-anchor="middle" font-size="24" font-family="Arial">Question → variables → trials → data → evidence</text>

<rect x="70" y="145" width="210" height="105" rx="15" fill="#fff3cd" stroke="#111" stroke-width="4"/>
<text x="175" y="180" text-anchor="middle" font-size="25" font-weight="bold" font-family="Arial">1. Question</text>
<text x="175" y="218" text-anchor="middle" font-size="19" font-family="Arial">What am I testing?</text>

<rect x="345" y="145" width="210" height="105" rx="15" fill="#e9ecef" stroke="#111" stroke-width="4"/>
<text x="450" y="180" text-anchor="middle" font-size="25" font-weight="bold" font-family="Arial">2. Variables</text>
<text x="450" y="210" text-anchor="middle" font-size="19" font-family="Arial">Change one thing</text>
<text x="450" y="235" text-anchor="middle" font-size="19" font-family="Arial">Measure one result</text>

<rect x="620" y="145" width="210" height="105" rx="15" fill="#d1e7dd" stroke="#111" stroke-width="4"/>
<text x="725" y="180" text-anchor="middle" font-size="25" font-weight="bold" font-family="Arial">3. Trials</text>
<text x="725" y="218" text-anchor="middle" font-size="19" font-family="Arial">Test 3 times</text>

<line x1="285" y1="197" x2="335" y2="197" stroke="#111" stroke-width="6"/>
<polygon points="338,197 318,185 318,209" fill="#111"/>
<line x1="560" y1="197" x2="610" y2="197" stroke="#111" stroke-width="6"/>
<polygon points="613,197 593,185 593,209" fill="#111"/>

<rect x="130" y="315" width="260" height="160" rx="15" fill="white" stroke="#111" stroke-width="4"/>
<text x="260" y="350" text-anchor="middle" font-size="25" font-weight="bold" font-family="Arial">Data Table</text>
<line x1="150" y1="375" x2="370" y2="375" stroke="#111" stroke-width="3"/>
<line x1="150" y1="415" x2="370" y2="415" stroke="#111" stroke-width="3"/>
<line x1="150" y1="455" x2="370" y2="455" stroke="#111" stroke-width="3"/>
<line x1="235" y1="375" x2="235" y2="460" stroke="#111" stroke-width="3"/>
<text x="190" y="402" text-anchor="middle" font-size="18" font-family="Arial">Trial</text>
<text x="305" y="402" text-anchor="middle" font-size="18" font-family="Arial">Distance</text>

<rect x="510" y="315" width="260" height="160" rx="15" fill="white" stroke="#111" stroke-width="4"/>
<text x="640" y="350" text-anchor="middle" font-size="25" font-weight="bold" font-family="Arial">Evidence</text>
<text x="640" y="390" text-anchor="middle" font-size="21" font-family="Arial">Use the data</text>
<text x="640" y="425" text-anchor="middle" font-size="21" font-family="Arial">to support</text>
<text x="640" y="460" text-anchor="middle" font-size="21" font-family="Arial">your claim</text>

</svg>
