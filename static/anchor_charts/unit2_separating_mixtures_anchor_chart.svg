<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-label="Separating Mixtures and Solutions anchor chart">
  <rect width="1200" height="1600" fill="#ffffff"/>
  <style>
    .title{font-family:Arial,sans-serif;font-size:72px;font-weight:900;fill:#2563eb}
    .title2{font-family:Arial,sans-serif;font-size:58px;font-weight:900;fill:#16a34a}
    .head{font-family:Arial,sans-serif;font-size:36px;font-weight:900}
    .text{font-family:Arial,sans-serif;font-size:24px;font-weight:800;fill:#111}
    .example{font-family:Arial,sans-serif;font-size:21px;font-weight:800}
    .box{stroke:#111;stroke-width:6;rx:28}
    .art{opacity:.25}
  </style>

  <text x="600" y="85" text-anchor="middle" class="title">Separating</text>
  <text x="600" y="155" text-anchor="middle" class="title2">Mixtures and Solutions</text>
  <text x="600" y="220" text-anchor="middle" class="text">Different ways to separate materials.</text>

  <g>
    <rect class="box" x="75" y="290" width="500" height="255" fill="#fff1f2"/>
    <g class="art"><path d="M400 360 h115 l-40 105 v50 h-35 v-50z" fill="#fff" stroke="#111" stroke-width="6"/><path d="M420 425 h75" stroke="#38bdf8" stroke-width="10"/></g>
    <text x="115" y="360" class="head" fill="#e11d48">1. Filter</text>
    <text x="115" y="415" class="text">separates solids from liquids</text>
    <text x="115" y="500" class="example" fill="#e11d48">Example: sand and water</text>

    <rect class="box" x="625" y="290" width="500" height="255" fill="#f0fdf4"/>
    <g class="art"><ellipse cx="970" cy="420" rx="95" ry="42" fill="#fff" stroke="#111" stroke-width="6"/><line x1="890" y1="420" x2="1050" y2="420" stroke="#777" stroke-width="3"/><circle cx="945" cy="405" r="13" fill="#6b7280" stroke="#111" stroke-width="4"/><circle cx="990" cy="430" r="13" fill="#6b7280" stroke="#111" stroke-width="4"/></g>
    <text x="665" y="360" class="head" fill="#16a34a">2. Sieve</text>
    <text x="665" y="415" class="text">separates large and small solids</text>
    <text x="665" y="500" class="example" fill="#16a34a">Example: rocks and sand</text>

    <rect class="box" x="75" y="590" width="500" height="255" fill="#eff6ff"/>
    <g class="art"><path d="M395 690 a75 75 0 0 1 150 0 v60 h-45 v-60 a30 30 0 0 0 -60 0 v60 h-45z" fill="#dc2626" stroke="#111" stroke-width="6"/><circle cx="410" cy="790" r="10" fill="#555" stroke="#111" stroke-width="4"/><circle cx="450" cy="800" r="10" fill="#555" stroke="#111" stroke-width="4"/></g>
    <text x="115" y="660" class="head" fill="#2563eb">3. Magnetism</text>
    <text x="115" y="715" class="text">separates magnetic items</text>
    <text x="115" y="800" class="example" fill="#2563eb">Example: paper clips and beans</text>

    <rect class="box" x="625" y="590" width="500" height="255" fill="#fff7ed"/>
    <g class="art"><rect x="920" y="695" width="120" height="110" rx="15" fill="#bfdbfe" stroke="#111" stroke-width="6"/><path d="M920 750 q60 25 120 0 v55 h-120z" fill="#60a5fa"/><circle cx="965" cy="745" r="22" fill="#a16207" stroke="#111" stroke-width="6"/><circle cx="1005" cy="790" r="24" fill="#6b7280" stroke="#111" stroke-width="6"/></g>
    <text x="665" y="660" class="head" fill="#ea580c">4. Density</text>
    <text x="665" y="715" class="text">some items float and some sink</text>
    <text x="665" y="800" class="example" fill="#ea580c">Example: cork and rock in water</text>

    <rect class="box" x="75" y="890" width="500" height="255" fill="#f0fdfa"/>
    <g class="art"><path d="M390 955 l125 -75 l24 34 l-128 75z" fill="#d1d5db" stroke="#111" stroke-width="6"/><circle cx="350" cy="1065" r="16" fill="#22c55e" stroke="#111" stroke-width="4"/><rect x="450" y="1048" width="32" height="32" fill="#a855f7" stroke="#111" stroke-width="4"/><polygon points="510,1085 540,1038 570,1085" fill="#f97316" stroke="#111" stroke-width="4"/></g>
    <text x="115" y="960" class="head" fill="#0f766e">5. Sorting Tools</text>
    <text x="115" y="1015" class="text">separate by size or shape</text>
    <text x="115" y="1100" class="example" fill="#0f766e">Example: beads by shape</text>

    <rect class="box" x="625" y="890" width="500" height="255" fill="#faf5ff"/>
    <g class="art"><ellipse cx="990" cy="1025" rx="100" ry="32" fill="#bfdbfe" stroke="#111" stroke-width="6"/><rect x="910" y="1060" width="165" height="60" rx="12" fill="#333" stroke="#111" stroke-width="6"/><path d="M930 970 q-15 -38 15 -72 M990 970 q-15 -38 15 -72 M1050 970 q-15 -38 15 -72" fill="none" stroke="#0284c7" stroke-width="6"/></g>
    <text x="665" y="960" class="head" fill="#7e22ce">6. Evaporation</text>
    <text x="665" y="1015" class="text">uses heat to separate dissolved solids</text>
    <text x="665" y="1100" class="example" fill="#7e22ce">Example: salt water</text>
  </g>

  <rect x="120" y="1245" width="960" height="160" rx="36" fill="#fff7d6" stroke="#111" stroke-width="6"/>
  <text x="600" y="1310" text-anchor="middle" class="text">Materials can be separated because they have</text>
  <text x="600" y="1360" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="900" fill="#2563eb">different physical properties!</text>
</svg>
