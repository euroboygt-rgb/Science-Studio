<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#6f2dbd"/>
      <stop offset="50%" stop-color="#123f8c"/>
      <stop offset="100%" stop-color="#00a6d6"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="7" dy="7" stdDeviation="0" flood-color="#111" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="800" rx="36" fill="#eaf7ff"/>
  <rect x="35" y="35" width="1130" height="730" rx="32" fill="url(#bg)" stroke="#111" stroke-width="10" filter="url(#shadow)"/>

  <text x="600" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" font-weight="900" fill="white">
    What Materials Are Magnetic?
  </text>

  <rect x="270" y="120" width="660" height="78" rx="36" fill="#ff9f1c" stroke="#111" stroke-width="7"/>
  <text x="600" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="900" fill="#111">
    Remember SINC
  </text>

  <g transform="translate(80 240)">
    <rect width="245" height="330" rx="26" fill="#fff7d6" stroke="#111" stroke-width="7"/>
    <circle cx="122" cy="68" r="48" fill="#b7c4d6" stroke="#111" stroke-width="5"/>
    <rect x="82" y="110" width="80" height="105" rx="10" fill="#8d99ae" stroke="#111" stroke-width="5"/>
    <line x1="98" y1="130" x2="146" y2="130" stroke="#f8f9fa" stroke-width="6"/>
    <line x1="98" y1="155" x2="146" y2="155" stroke="#f8f9fa" stroke-width="6"/>
    <line x1="98" y1="180" x2="146" y2="180" stroke="#f8f9fa" stroke-width="6"/>
    <text x="122" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="62" font-weight="900" fill="#6f2dbd">S</text>
    <text x="122" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#111">Steel</text>
  </g>

  <g transform="translate(355 240)">
    <rect width="245" height="330" rx="26" fill="#fff7d6" stroke="#111" stroke-width="7"/>
    <path d="M75 105 L170 105 L150 200 L95 200 Z" fill="#9c6644" stroke="#111" stroke-width="5"/>
    <rect x="94" y="65" width="55" height="55" rx="8" fill="#7f5539" stroke="#111" stroke-width="5"/>
    <circle cx="122" cy="150" r="20" fill="#b08968"/>
    <text x="122" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="62" font-weight="900" fill="#6f2dbd">I</text>
    <text x="122" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#111">Iron</text>
  </g>

  <g transform="translate(630 240)">
    <rect width="245" height="330" rx="26" fill="#fff7d6" stroke="#111" stroke-width="7"/>
    <circle cx="122" cy="140" r="70" fill="#d6d6d6" stroke="#111" stroke-width="6"/>
    <circle cx="122" cy="140" r="45" fill="#f4f4f4" stroke="#8d99ae" stroke-width="5"/>
    <text x="122" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="900" fill="#555">5¢</text>
    <text x="122" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="62" font-weight="900" fill="#6f2dbd">N</text>
    <text x="122" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#111">Nickel</text>
  </g>

  <g transform="translate(905 240)">
    <rect width="245" height="330" rx="26" fill="#fff7d6" stroke="#111" stroke-width="7"/>
    <polygon points="122,58 180,105 160,190 83,190 63,105" fill="#4361ee" stroke="#111" stroke-width="6"/>
    <polygon points="122,82 153,113 142,165 102,165 91,113" fill="#4cc9f0" stroke="#111" stroke-width="4"/>
    <text x="122" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="62" font-weight="900" fill="#6f2dbd">C</text>
    <text x="122" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#111">Cobalt</text>
  </g>

  <rect x="95" y="610" width="1010" height="95" rx="26" fill="white" stroke="#111" stroke-width="7"/>
  <text x="600" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#111">
    Magnetic materials are usually made with steel, iron, nickel, or cobalt.
  </text>
  <text x="600" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#123f8c">
    STAAR clue: If a magnet pulls it, use evidence to classify it as magnetic.
  </text>

  <text x="600" y="744" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="white">
    SINC = Steel • Iron • Nickel • Cobalt
  </text>
</svg>
