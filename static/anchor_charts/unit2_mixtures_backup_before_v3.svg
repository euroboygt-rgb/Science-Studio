<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-label="Mixtures anchor chart">
<rect width="1200" height="1600" fill="#ffffff"/>
<style>
.title{font-family:Arial,sans-serif;font-size:78px;font-weight:900}
.subtitle{font-family:Arial,sans-serif;font-size:32px;font-weight:800;fill:#111}
.head{font-family:Arial,sans-serif;font-size:34px;font-weight:900}
.text{font-family:Arial,sans-serif;font-size:25px;font-weight:700;fill:#111}
.small{font-family:Arial,sans-serif;font-size:21px;font-weight:700;fill:#111}
.tiny{font-family:Arial,sans-serif;font-size:18px;font-weight:700;fill:#111}
.box{stroke:#111;stroke-width:6}
</style>
<text x="600" y="100" text-anchor="middle" font-family="Arial,sans-serif" font-size="88" font-weight="900" fill="#6f2dbd">Mixtures</text>
<path d="M260 140 Q600 180 940 140" fill="none" stroke="#00a6d6" stroke-width="10"/>
<text x="600" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="900" fill="#111">A mixture combines two or more materials.</text>
<text x="600" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="900" fill="#111">Each material keeps its own physical properties.</text>
<rect class="box" x="90" y="345" width="460" height="270" rx="28" fill="#f0fdf4"/>
<text x="320" y="400" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="900" fill="#16a34a">
<tspan x="320" dy="0">Ingredients stay the</tspan>
<tspan x="320" dy="37">same</tspan>
</text>

        <circle cx="265" cy="508" r="45" fill="#f97316" stroke="#111" stroke-width="5"/>
        <rect x="345" y="483" width="88" height="60" fill="#c2410c" stroke="#111" stroke-width="5"/>
        <circle cx="375" cy="513" r="8" fill="#fff7d6"/>
        <circle cx="410" cy="523" r="8" fill="#fff7d6"/>
        <path d="M240 578 Q335 535 435 578" fill="none" stroke="#111" stroke-width="5"/>
        
<text x="320" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#111">
<tspan x="320" dy="0">A cookie and raisins keep their</tspan>
<tspan x="320" dy="26">properties.</tspan>
</text>
<rect class="box" x="650" y="345" width="460" height="270" rx="28" fill="#eff6ff"/>
<text x="880" y="400" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="900" fill="#2563eb">
<tspan x="880" dy="0">Examples</tspan>
</text>

        <rect x="800" y="453" width="90" height="120" rx="12" fill="#bfdbfe" stroke="#111" stroke-width="5"/>
        <path d="M800 528 Q845 553 890 528 L890 573 L800 573 Z" fill="#d6a85c"/>
        <rect x="930" y="453" width="90" height="120" rx="12" fill="#bfdbfe" stroke="#111" stroke-width="5"/>
        <path d="M930 498 Q975 518 1020 498 L1020 573 L930 573 Z" fill="#60a5fa"/>
        
<text x="880" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#111">
<tspan x="880" dy="0">trail mix • sand and water</tspan>
</text>
<rect class="box" x="90" y="685" width="460" height="270" rx="28" fill="#fff7ed"/>
<text x="320" y="740" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="900" fill="#ea580c">
<tspan x="320" dy="0">Can often be separated</tspan>
</text>

        <path d="M275 793 H390 L345 898 V385 H320 V335 Z" fill="#fff" stroke="#111" stroke-width="5"/>
        <path d="M290 848 H375" stroke="#38bdf8" stroke-width="10"/>
        
<text x="320" y="920" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#111">
<tspan x="320" dy="0">use magnets, filters, sieves, or</tspan>
<tspan x="320" dy="26">sorting</tspan>
</text>
<rect class="box" x="650" y="685" width="460" height="270" rx="28" fill="#fdf2f8"/>
<text x="880" y="740" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="900" fill="#db2777">
<tspan x="880" dy="0">Particles mix, not</tspan>
<tspan x="880" dy="37">change</tspan>
</text>

        <rect x="795" y="793" width="120" height="130" rx="14" fill="#bfdbfe" stroke="#111" stroke-width="5"/>
        <path d="M795 855 Q855 881 915 855 L915 923 L795 923 Z" fill="#60a5fa"/>
        
<text x="880" y="920" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#111">
<tspan x="880" dy="0">materials mix but are not</tspan>
<tspan x="880" dy="26">chemically changed</tspan>
</text>
<rect x="130" y="1055" width="940" height="300" rx="36" fill="#fff7d6" stroke="#111" stroke-width="6"/>
<text x="600" y="1120" text-anchor="middle" font-family="Arial,sans-serif" font-size="44" font-weight="900" fill="#6f2dbd">Mixtures in Action</text>

        <rect x="270" y="1185" width="90" height="120" rx="12" fill="#bfdbfe" stroke="#111" stroke-width="5"/>
        <path d="M270 1260 Q315 1285 360 1260 L360 1305 L270 1305 Z" fill="#d6a85c"/>
        <rect x="400" y="1185" width="90" height="120" rx="12" fill="#bfdbfe" stroke="#111" stroke-width="5"/>
        <path d="M400 1230 Q445 1250 490 1230 L490 1305 L400 1305 Z" fill="#60a5fa"/>
        
<text x="520" y="1245" text-anchor="middle" font-family="Arial,sans-serif" font-size="58" font-weight="900" fill="#111">+</text>

        <rect x="600" y="1185" width="120" height="130" rx="14" fill="#bfdbfe" stroke="#111" stroke-width="5"/>
        <path d="M600 1247 Q660 1273 720 1247 L720 1315 L600 1315 Z" fill="#60a5fa"/>
        
<text x="800" y="1245" text-anchor="middle" font-family="Arial,sans-serif" font-size="58" font-weight="900" fill="#111">→</text>

        <path d="M910 1185 H1025 L980 1290 V1020 H955 V970 Z" fill="#fff" stroke="#111" stroke-width="5"/>
        <path d="M925 1240 H1010" stroke="#38bdf8" stroke-width="10"/>
        
<text x="600" y="1320" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#111">Sand and water can be mixed and separated.</text>
<text x="600" y="1470" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="900" fill="#111">Remember: mixtures can often be separated because properties are different!</text>
</svg>
