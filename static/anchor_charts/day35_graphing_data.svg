<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
<rect width="900" height="600" rx="24" fill="white"/>
<rect x="20" y="20" width="860" height="560" rx="22" fill="#f8f9fa" stroke="#111" stroke-width="5"/>
<text x="450" y="65" text-anchor="middle" font-size="38" font-weight="bold" font-family="Arial">Graphing Investigation Data</text>
<text x="450" y="105" text-anchor="middle" font-size="24" font-family="Arial">Independent variable on x-axis, dependent variable on y-axis</text>

<rect x="100" y="135" width="700" height="360" rx="15" fill="white" stroke="#111" stroke-width="4"/>
<line x1="185" y1="435" x2="735" y2="435" stroke="#111" stroke-width="6"/>
<line x1="185" y1="435" x2="185" y2="175" stroke="#111" stroke-width="6"/>

<rect x="270" y="350" width="70" height="85" fill="#e9ecef" stroke="#111" stroke-width="4"/>
<rect x="425" y="290" width="70" height="145" fill="#e9ecef" stroke="#111" stroke-width="4"/>
<rect x="580" y="220" width="70" height="215" fill="#e9ecef" stroke="#111" stroke-width="4"/>

<text x="305" y="468" text-anchor="middle" font-size="20" font-family="Arial">Low</text>
<text x="460" y="468" text-anchor="middle" font-size="20" font-family="Arial">Medium</text>
<text x="615" y="468" text-anchor="middle" font-size="20" font-family="Arial">High</text>

<text x="460" y="530" text-anchor="middle" font-size="26" font-weight="bold" font-family="Arial">X-axis = independent variable</text>
<text x="75" y="320" text-anchor="middle" font-size="24" font-weight="bold" font-family="Arial" transform="rotate(-90 75 320)">Y-axis = dependent variable</text>

<text x="460" y="170" text-anchor="middle" font-size="25" font-weight="bold" font-family="Arial">Effect of Ramp Height on Distance</text>
<text x="460" y="565" text-anchor="middle" font-size="22" font-family="Arial">Graph the data, find the pattern, write the claim.</text>

