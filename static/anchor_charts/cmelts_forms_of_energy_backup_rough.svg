<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200">
  <rect x="20" y="20" width="860" height="1160" rx="35" fill="#ffffff" stroke="#0d47a1" stroke-width="10"/>

  <text x="450" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="66" font-weight="900" fill="#111">CMELTS</text>
  <text x="450" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#111">Forms of Energy</text>

  <rect x="70" y="175" width="760" height="62" rx="25" fill="#ffffff" stroke="#111" stroke-width="4"/>
  <text x="450" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="900" fill="#111">
    Chemical • Mechanical • Electrical • Light • Thermal • Sound
  </text>

  <rect x="60" y="275" width="780" height="120" rx="22" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="5"/>
  <rect x="60" y="275" width="120" height="120" rx="22" fill="#8e24aa"/>
  <text x="120" y="357" text-anchor="middle" font-family="Arial" font-size="78" font-weight="900" fill="#fff">C</text>
  <text x="210" y="320" font-family="Arial" font-size="35" font-weight="900" fill="#6a1b9a">C = Chemical</text>
  <text x="210" y="360" font-family="Arial" font-size="24" font-weight="700" fill="#111">Energy stored in food, batteries, and fuels.</text>
  <text x="700" y="355" text-anchor="middle" font-family="Arial" font-size="58">Battery • Food • Fuel</text>

  <rect x="60" y="410" width="780" height="120" rx="22" fill="#e3f2fd" stroke="#1565c0" stroke-width="5"/>
  <rect x="60" y="410" width="120" height="120" rx="22" fill="#1976d2"/>
  <text x="120" y="492" text-anchor="middle" font-family="Arial" font-size="78" font-weight="900" fill="#fff">M</text>
  <text x="210" y="455" font-family="Arial" font-size="35" font-weight="900" fill="#1565c0">M = Mechanical</text>
  <text x="210" y="495" font-family="Arial" font-size="24" font-weight="700" fill="#111">Energy of motion and moving parts.</text>
  <text x="700" y="490" text-anchor="middle" font-family="Arial" font-size="58">Motion</text>

  <rect x="60" y="545" width="780" height="120" rx="22" fill="#e8f5e9" stroke="#2e7d32" stroke-width="5"/>
  <rect x="60" y="545" width="120" height="120" rx="22" fill="#43a047"/>
  <text x="120" y="627" text-anchor="middle" font-family="Arial" font-size="78" font-weight="900" fill="#fff">E</text>
  <text x="210" y="590" font-family="Arial" font-size="35" font-weight="900" fill="#2e7d32">E = Electrical</text>
  <text x="210" y="630" font-family="Arial" font-size="24" font-weight="700" fill="#111">Energy carried by electric current through wires.</text>
  <text x="700" y="625" text-anchor="middle" font-family="Arial" font-size="58">Current</text>

  <rect x="60" y="680" width="780" height="120" rx="22" fill="#fff3e0" stroke="#ef6c00" stroke-width="5"/>
  <rect x="60" y="680" width="120" height="120" rx="22" fill="#fb8c00"/>
  <text x="120" y="762" text-anchor="middle" font-family="Arial" font-size="78" font-weight="900" fill="#fff">L</text>
  <text x="210" y="725" font-family="Arial" font-size="35" font-weight="900" fill="#ef6c00">L = Light</text>
  <text x="210" y="765" font-family="Arial" font-size="24" font-weight="700" fill="#111">Energy we can see from the Sun, bulbs, and screens.</text>
  <text x="700" y="760" text-anchor="middle" font-family="Arial" font-size="58">Light</text>

  <rect x="60" y="815" width="780" height="120" rx="22" fill="#ffebee" stroke="#c62828" stroke-width="5"/>
  <rect x="60" y="815" width="120" height="120" rx="22" fill="#e53935"/>
  <text x="120" y="897" text-anchor="middle" font-family="Arial" font-size="78" font-weight="900" fill="#fff">T</text>
  <text x="210" y="860" font-family="Arial" font-size="35" font-weight="900" fill="#c62828">T = Thermal</text>
  <text x="210" y="900" font-family="Arial" font-size="24" font-weight="700" fill="#111">Heat energy that makes things warmer.</text>
  <text x="700" y="895" text-anchor="middle" font-family="Arial" font-size="58">Heat</text>

  <rect x="60" y="950" width="780" height="120" rx="22" fill="#e0f7fa" stroke="#00838f" stroke-width="5"/>
  <rect x="60" y="950" width="120" height="120" rx="22" fill="#00acc1"/>
  <text x="120" y="1032" text-anchor="middle" font-family="Arial" font-size="78" font-weight="900" fill="#fff">S</text>
  <text x="210" y="995" font-family="Arial" font-size="35" font-weight="900" fill="#00838f">S = Sound</text>
  <text x="210" y="1035" font-family="Arial" font-size="24" font-weight="700" fill="#111">Energy made by vibrations that we can hear.</text>
  <text x="700" y="1030" text-anchor="middle" font-family="Arial" font-size="58">Vibrations</text>

  <text x="450" y="1150" text-anchor="middle" font-family="Arial" font-size="42" font-weight="900" fill="#111">Science is ENERGIZING!</text>
</svg>
