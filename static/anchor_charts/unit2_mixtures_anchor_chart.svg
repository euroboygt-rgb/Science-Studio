<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-label="Mixtures anchor chart">
  <rect width="1200" height="1600" fill="#ffffff"/>
  <style>
    .title{font-family:Arial,sans-serif;font-size:88px;font-weight:900;fill:#6f2dbd}
    .subtitle{font-family:Arial,sans-serif;font-size:34px;font-weight:900;fill:#111}
    .head{font-family:Arial,sans-serif;font-size:34px;font-weight:900}
    .text{font-family:Arial,sans-serif;font-size:24px;font-weight:800;fill:#111}
    .box{stroke:#111;stroke-width:6;rx:28}
    .art{opacity:.25}
  </style>

  <text x="600" y="100" text-anchor="middle" class="title">Mixtures</text>
  <path d="M260 140 Q600 180 940 140" fill="none" stroke="#00a6d6" stroke-width="10"/>
  <text x="600" y="215" text-anchor="middle" class="subtitle">A mixture combines two or more materials.</text>
  <text x="600" y="265" text-anchor="middle" class="subtitle">Each material keeps its own physical properties.</text>

  <g>
    <rect class="box" x="90" y="345" width="460" height="270" fill="#f0fdf4"/>
    <g class="art">
      <circle cx="225" cy="500" r="55" fill="#f6b35d" stroke="#111" stroke-width="6"/>
      <circle cx="205" cy="485" r="9" fill="#4b2e1e"/>
      <circle cx="245" cy="525" r="9" fill="#4b2e1e"/>
      <ellipse cx="385" cy="500" rx="55" ry="33" fill="#6d28d9" stroke="#111" stroke-width="6"/>
      <ellipse cx="455" cy="520" rx="55" ry="33" fill="#6d28d9" stroke="#111" stroke-width="6"/>
    </g>
    <text x="320" y="410" text-anchor="middle" class="head" fill="#16a34a">Ingredients Stay the Same</text>
    <text x="320" y="560" text-anchor="middle" class="text">A cookie and raisins keep properties.</text>

    <rect class="box" x="650" y="345" width="460" height="270" fill="#eff6ff"/>
    <g class="art">
      <ellipse cx="770" cy="500" rx="90" ry="38" fill="#60a5fa" stroke="#111" stroke-width="6"/>
      <circle cx="735" cy="465" r="13" fill="#ef4444" stroke="#111" stroke-width="4"/>
      <circle cx="775" cy="455" r="13" fill="#f59e0b" stroke="#111" stroke-width="4"/>
      <circle cx="820" cy="475" r="13" fill="#22c55e" stroke="#111" stroke-width="4"/>
      <rect x="940" y="430" width="70" height="105" rx="12" fill="#bfdbfe" stroke="#111" stroke-width="6"/>
      <path d="M940 490 q35 22 70 0 v45 h-70z" fill="#d6a85c"/>
    </g>
    <text x="880" y="410" text-anchor="middle" class="head" fill="#2563eb">Examples</text>
    <text x="880" y="560" text-anchor="middle" class="text">trail mix • sand and water</text>

    <rect class="box" x="90" y="680" width="460" height="270" fill="#fff7ed"/>
    <g class="art">
      <rect x="190" y="790" width="110" height="65" fill="#ef4444" stroke="#111" stroke-width="6"/>
      <rect x="300" y="790" width="35" height="65" fill="#2563eb" stroke="#111" stroke-width="6"/>
      <circle cx="175" cy="900" r="12" fill="#555" stroke="#111" stroke-width="4"/>
      <circle cx="215" cy="910" r="12" fill="#555" stroke="#111" stroke-width="4"/>
      <circle cx="255" cy="900" r="12" fill="#555" stroke="#111" stroke-width="4"/>
      <path d="M390 760 h95 l-35 95 v55 h-25 v-55z" fill="#fff" stroke="#111" stroke-width="6"/>
      <path d="M405 805 h65" stroke="#38bdf8" stroke-width="10"/>
    </g>
    <text x="320" y="745" text-anchor="middle" class="head" fill="#ea580c">Can Often Be Separated</text>
    <text x="320" y="905" text-anchor="middle" class="text">use magnets, filters, sieves, or sorting</text>

    <rect class="box" x="650" y="680" width="460" height="270" fill="#fdf2f8"/>
    <g class="art">
      <circle cx="785" cy="820" r="65" fill="#fff" stroke="#2563eb" stroke-width="6"/>
      <circle cx="760" cy="800" r="11" fill="#60a5fa" stroke="#111" stroke-width="3"/>
      <circle cx="795" cy="840" r="11" fill="#d6a85c" stroke="#111" stroke-width="3"/>
      <path d="M865 820 h60" stroke="#111" stroke-width="7"/>
      <path d="M915 797 l40 23 l-40 23z" fill="#111"/>
      <circle cx="1010" cy="820" r="65" fill="#fff" stroke="#db2777" stroke-width="6"/>
      <circle cx="985" cy="800" r="11" fill="#60a5fa" stroke="#111" stroke-width="3"/>
      <circle cx="1020" cy="840" r="11" fill="#d6a85c" stroke="#111" stroke-width="3"/>
    </g>
    <text x="880" y="745" text-anchor="middle" class="head" fill="#db2777">Particles Mix, Not Change</text>
    <text x="880" y="905" text-anchor="middle" class="text">mixed, not chemically changed</text>
  </g>

  <rect x="130" y="1040" width="940" height="320" rx="36" fill="#fff7d6" stroke="#111" stroke-width="6"/>
  <g class="art">
    <rect x="245" y="1170" width="125" height="130" rx="14" fill="#bfdbfe" stroke="#111" stroke-width="6"/>
    <path d="M245 1245 q63 30 125 0 v55 h-125z" fill="#d6a85c"/>
    <rect x="535" y="1170" width="125" height="130" rx="14" fill="#bfdbfe" stroke="#111" stroke-width="6"/>
    <path d="M535 1225 q63 25 125 0 v75 h-125z" fill="#60a5fa"/>
    <path d="M830 1170 h95 l-35 95 v55 h-25 v-55z" fill="#fff" stroke="#111" stroke-width="6"/>
  </g>
  <text x="600" y="1110" text-anchor="middle" class="head" fill="#6f2dbd">Mixtures in Action</text>
  <text x="405" y="1240" text-anchor="middle" font-family="Arial,sans-serif" font-size="58" font-weight="900">+</text>
  <text x="735" y="1240" text-anchor="middle" font-family="Arial,sans-serif" font-size="58" font-weight="900">→</text>
  <text x="307" y="1330" text-anchor="middle" class="text">sand</text>
  <text x="597" y="1330" text-anchor="middle" class="text">water</text>
  <text x="880" y="1330" text-anchor="middle" class="text">separate</text>
  <text x="600" y="1480" text-anchor="middle" class="subtitle">Mixtures can often be separated because properties are different.</text>
</svg>
