<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-label="Properties of Matter anchor chart">
  <rect width="1200" height="1600" fill="#ffffff"/>
  <style>
    .title{font-family:Arial,sans-serif;font-size:72px;font-weight:900;fill:#6f2dbd}
    .subtitle{font-family:Arial,sans-serif;font-size:31px;font-weight:800;fill:#111}
    .head{font-family:Arial,sans-serif;font-size:34px;font-weight:900}
    .text{font-family:Arial,sans-serif;font-size:23px;font-weight:800;fill:#111}
    .tiny{font-family:Arial,sans-serif;font-size:20px;font-weight:800;fill:#111}
    .box{stroke:#111;stroke-width:6;rx:28}
    .art{opacity:.28}
  </style>

  <text x="600" y="92" text-anchor="middle" class="title">Properties of Matter</text>
  <path d="M210 125 Q600 170 990 125" fill="none" stroke="#00a6d6" stroke-width="10"/>
  <text x="600" y="195" text-anchor="middle" class="subtitle">Matter takes up space and has mass.</text>
  <text x="600" y="242" text-anchor="middle" class="subtitle">We identify matter by its physical properties.</text>

  <g>
    <rect class="box" x="70" y="315" width="330" height="250" fill="#fff7d6"/>
    <g class="art">
      <line x1="135" y1="450" x2="330" y2="450" stroke="#111" stroke-width="8"/>
      <rect x="210" y="385" width="34" height="120" fill="#555" stroke="#111" stroke-width="6"/>
      <rect x="165" y="435" width="120" height="45" fill="#ddd" stroke="#111" stroke-width="6"/>
      <circle cx="135" cy="505" r="36" fill="#9ca3af" stroke="#111" stroke-width="6"/>
      <circle cx="320" cy="505" r="30" fill="#f97316" stroke="#111" stroke-width="6"/>
    </g>
    <text x="235" y="370" text-anchor="middle" class="head" fill="#0f766e">Mass</text>
    <text x="235" y="520" text-anchor="middle" class="text">amount of matter</text>

    <rect class="box" x="435" y="315" width="330" height="250" fill="#eef9ff"/>
    <g class="art">
      <rect x="540" y="405" width="135" height="135" rx="16" fill="#bfdbfe" stroke="#111" stroke-width="6"/>
      <path d="M540 465 Q607 495 675 465 L675 540 L540 540 Z" fill="#60a5fa"/>
      <circle cx="580" cy="455" r="25" fill="#fbbf24" stroke="#111" stroke-width="6"/>
      <circle cx="635" cy="525" r="28" fill="#6b7280" stroke="#111" stroke-width="6"/>
    </g>
    <text x="600" y="370" text-anchor="middle" class="head" fill="#1d4ed8">Density</text>
    <text x="600" y="520" text-anchor="middle" class="text">float or sink in water</text>

    <rect class="box" x="800" y="315" width="330" height="250" fill="#fff7ed"/>
    <g class="art">
      <path d="M935 390 H1035 L1010 530 Q985 550 960 530 Z" fill="#dbeafe" stroke="#111" stroke-width="6"/>
      <path d="M948 470 Q985 492 1023 470 L1010 530 Q985 550 960 530 Z" fill="#0284c7"/>
      <line x1="1020" y1="420" x2="990" y2="420" stroke="#111" stroke-width="5"/>
      <line x1="1015" y1="452" x2="990" y2="452" stroke="#111" stroke-width="5"/>
    </g>
    <text x="965" y="370" text-anchor="middle" class="head" fill="#9333ea">Volume</text>
    <text x="965" y="520" text-anchor="middle" class="text">space matter takes up</text>

    <rect class="box" x="70" y="610" width="330" height="250" fill="#fdf2f8"/>
    <g class="art">
      <rect x="160" y="690" width="52" height="110" rx="18" fill="#fff" stroke="#111" stroke-width="6"/>
      <rect x="178" y="720" width="16" height="62" fill="#ef4444"/>
      <circle cx="186" cy="820" r="28" fill="#ef4444" stroke="#111" stroke-width="6"/>
      <circle cx="295" cy="700" r="28" fill="#fde047" stroke="#111" stroke-width="6"/>
    </g>
    <text x="235" y="665" text-anchor="middle" class="head" fill="#db2777">Temperature</text>
    <text x="235" y="815" text-anchor="middle" class="text">hot or cold</text>

    <rect class="box" x="435" y="610" width="330" height="250" fill="#fff7d6"/>
    <g class="art">
      <circle cx="535" cy="740" r="45" fill="#f97316" stroke="#111" stroke-width="6"/>
      <rect x="620" y="715" width="88" height="60" fill="#c2410c" stroke="#111" stroke-width="6"/>
      <circle cx="650" cy="745" r="8" fill="#fff7d6"/>
      <circle cx="685" cy="755" r="8" fill="#fff7d6"/>
    </g>
    <text x="600" y="665" text-anchor="middle" class="head" fill="#ea580c">Texture</text>
    <text x="600" y="815" text-anchor="middle" class="text">smooth, rough, soft</text>

    <rect class="box" x="800" y="610" width="330" height="250" fill="#f0fdf4"/>
    <g class="art">
      <rect x="860" y="730" width="55" height="80" rx="10" fill="#9ca3af" stroke="#111" stroke-width="6"/>
      <circle cx="1000" cy="760" r="34" fill="#fde047" stroke="#111" stroke-width="6"/>
      <path d="M910 775 C950 705 1025 705 1065 775" fill="none" stroke="#0284c7" stroke-width="10"/>
    </g>
    <text x="965" y="665" text-anchor="middle" class="head" fill="#854d0e">Conductivity</text>
    <text x="965" y="790" text-anchor="middle" class="tiny">energy flows or is blocked</text>

    <rect class="box" x="70" y="905" width="330" height="250" fill="#f5f3ff"/>
    <g class="art">
      <path d="M150 1010 a70 70 0 0 1 140 0 v55 h-42 v-55 a28 28 0 0 0 -56 0 v55 h-42z" fill="#dc2626" stroke="#111" stroke-width="6"/>
      <rect x="150" y="1065" width="42" height="38" fill="#d1d5db" stroke="#111" stroke-width="6"/>
      <rect x="248" y="1065" width="42" height="38" fill="#d1d5db" stroke="#111" stroke-width="6"/>
    </g>
    <text x="235" y="960" text-anchor="middle" class="head" fill="#4f46e5">Magnetism</text>
    <text x="235" y="1115" text-anchor="middle" class="text">attract or repel</text>

    <rect class="box" x="435" y="905" width="330" height="250" fill="#eff6ff"/>
    <g class="art">
      <rect x="495" y="1015" width="95" height="110" rx="12" fill="#bfdbfe" stroke="#111" stroke-width="6"/>
      <circle cx="542" cy="1055" r="7" fill="#fff" stroke="#111" stroke-width="3"/>
      <rect x="620" y="1015" width="95" height="110" rx="12" fill="#bfdbfe" stroke="#111" stroke-width="6"/>
      <path d="M625 1087 q45 25 85 0 v38 h-85z" fill="#d6a85c"/>
    </g>
    <text x="600" y="960" text-anchor="middle" class="head" fill="#0284c7">Solubility</text>
    <text x="600" y="1115" text-anchor="middle" class="tiny">dissolves or does not dissolve</text>

    <rect class="box" x="800" y="905" width="330" height="250" fill="#ecfdf5"/>
    <g class="art">
      <rect x="885" y="1015" width="55" height="55" fill="#93c5fd" stroke="#111" stroke-width="6"/>
      <path d="M985 1070 q42 -70 90 0 q-45 36 -90 0" fill="#38bdf8" stroke="#111" stroke-width="6"/>
      <path d="M890 1120 q25 -25 55 0 q25 -25 55 0 q25 -25 55 0" fill="none" stroke="#9ca3af" stroke-width="8"/>
    </g>
    <text x="965" y="960" text-anchor="middle" class="head" fill="#16a34a">Physical State</text>
    <text x="965" y="1120" text-anchor="middle" class="text">solid, liquid, gas</text>
  </g>

  <rect x="130" y="1240" width="940" height="190" rx="36" fill="#fff7d6" stroke="#111" stroke-width="6"/>
  <text x="600" y="1310" text-anchor="middle" class="head" fill="#6f2dbd">Remember!</text>
  <text x="600" y="1365" text-anchor="middle" class="subtitle">Physical properties can be observed or measured</text>
  <text x="600" y="1410" text-anchor="middle" class="subtitle">without changing what the matter is.</text>
</svg>
