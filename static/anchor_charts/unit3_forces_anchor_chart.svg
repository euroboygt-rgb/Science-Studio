<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-label="Forces anchor chart">
  <rect width="1200" height="1600" fill="#ffffff"/>
  <style>
    .title{font-family:Arial,sans-serif;font-size:98px;font-weight:900;fill:#2563eb}
    .subtitle{font-family:Arial,sans-serif;font-size:36px;font-weight:900;fill:#111}
    .head{font-family:Arial,sans-serif;font-size:40px;font-weight:900}
    .text{font-family:Arial,sans-serif;font-size:25px;font-weight:800;fill:#111}
    .box{stroke:#111;stroke-width:6;rx:30}
    .art{opacity:.25}
  </style>

  <text x="600" y="100" text-anchor="middle" class="title">Forces</text>
  <path d="M330 145 Q600 185 870 145" fill="none" stroke="#16a34a" stroke-width="10"/>
  <text x="600" y="220" text-anchor="middle" class="subtitle">Forces can be balanced or unbalanced.</text>

  <rect class="box" x="110" y="300" width="980" height="240" fill="#faf5ff"/>
  <g class="art"><rect x="245" y="410" width="135" height="80" fill="#a16207" stroke="#111" stroke-width="6"/><line x1="145" y1="450" x2="265" y2="450" stroke="#7e22ce" stroke-width="12"/><polygon points="265,415 315,450 265,485" fill="#7e22ce" stroke="#111" stroke-width="5"/><rect x="820" y="410" width="135" height="80" fill="#a16207" stroke="#111" stroke-width="6"/><line x1="1060" y1="450" x2="940" y2="450" stroke="#dc2626" stroke-width="12"/><polygon points="940,415 890,450 940,485" fill="#dc2626" stroke="#111" stroke-width="5"/></g>
  <text x="600" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="54" font-weight="900" fill="#111">A force is a <tspan fill="#7e22ce">PUSH</tspan> or a <tspan fill="#dc2626">PULL</tspan>.</text>

  <g>
    <rect class="box" x="90" y="620" width="500" height="330" fill="#f0fdf4"/>
    <g class="art"><line x1="220" y1="810" x2="355" y2="810" stroke="#16a34a" stroke-width="12"/><polygon points="220,775 170,810 220,845" fill="#16a34a" stroke="#111" stroke-width="6"/><line x1="480" y1="810" x2="345" y2="810" stroke="#16a34a" stroke-width="12"/><polygon points="480,775 530,810 480,845" fill="#16a34a" stroke="#111" stroke-width="6"/><rect x="280" y="870" width="160" height="55" fill="#a16207" stroke="#111" stroke-width="6"/></g>
    <text x="340" y="690" text-anchor="middle" class="head" fill="#16a34a">Balanced Forces</text>
    <text x="340" y="750" text-anchor="middle" class="text">equal size, opposite directions</text>
    <text x="340" y="920" text-anchor="middle" class="text">object stays still or moves the same</text>

    <rect class="box" x="610" y="620" width="500" height="330" fill="#fff1f2"/>
    <g class="art"><line x1="725" y1="810" x2="815" y2="810" stroke="#16a34a" stroke-width="10"/><polygon points="725,780 680,810 725,840" fill="#16a34a" stroke="#111" stroke-width="6"/><line x1="830" y1="810" x2="1020" y2="810" stroke="#dc2626" stroke-width="14"/><polygon points="1020,765 1085,810 1020,855" fill="#dc2626" stroke="#111" stroke-width="6"/><rect x="815" y="875" width="165" height="45" rx="20" fill="#2563eb" stroke="#111" stroke-width="6"/><circle cx="850" cy="930" r="18" fill="#111"/><circle cx="945" cy="930" r="18" fill="#111"/></g>
    <text x="860" y="690" text-anchor="middle" class="head" fill="#dc2626">Unbalanced Forces</text>
    <text x="860" y="750" text-anchor="middle" class="text">not equal; motion changes</text>
    <text x="860" y="920" text-anchor="middle" class="text">starts, stops, speeds up, slows down</text>

    <rect class="box" x="90" y="1010" width="500" height="330" fill="#eff6ff"/>
    <g class="art"><rect x="210" y="1235" width="210" height="45" rx="20" fill="#ef4444" stroke="#111" stroke-width="6"/><circle cx="255" cy="1290" r="19" fill="#111"/><circle cx="375" cy="1290" r="19" fill="#111"/><rect x="295" y="1190" width="85" height="45" fill="#f97316" stroke="#111" stroke-width="6"/></g>
    <text x="340" y="1080" text-anchor="middle" class="head" fill="#2563eb">Friction</text>
    <text x="340" y="1140" text-anchor="middle" class="text">surfaces rub together</text>
    <text x="340" y="1188" text-anchor="middle" class="text" fill="#2563eb">It slows motion.</text>
    <text x="340" y="1305" text-anchor="middle" class="text">brakes, shoes, rough surfaces</text>

    <rect class="box" x="610" y="1010" width="500" height="330" fill="#faf5ff"/>
    <g class="art"><circle cx="790" cy="1235" r="35" fill="#ef4444" stroke="#111" stroke-width="6"/><line x1="790" y1="1160" x2="790" y2="1200" stroke="#7e22ce" stroke-width="8"/><polygon points="770,1195 790,1230 810,1195" fill="#7e22ce"/><circle cx="970" cy="1235" r="62" fill="#38bdf8" stroke="#111" stroke-width="6"/></g>
    <text x="860" y="1080" text-anchor="middle" class="head" fill="#7e22ce">Gravity</text>
    <text x="860" y="1140" text-anchor="middle" class="text">pulls objects toward Earth</text>
    <text x="860" y="1305" text-anchor="middle" class="text">falling objects, orbit, weight</text>
  </g>

  <text x="600" y="1500" text-anchor="middle" font-family="Arial,sans-serif" font-size="44" font-weight="900" fill="#6f2dbd">Forces are all around us!</text>
</svg>
