<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1055 1491" role="img" aria-label="Forces anchor chart">
<rect width="1055" height="1491" fill="#fff"/>
<text x="527" y="95" text-anchor="middle" font-family="Comic Sans MS, Arial" font-size="100" font-weight="900" fill="#2563eb">Forces</text>
<path d="M250 125 Q527 165 805 125" fill="none" stroke="#16a34a" stroke-width="10"/>
<text x="527" y="200" text-anchor="middle" font-family="Comic Sans MS, Arial" font-size="43" font-weight="900" fill="#111">Forces can be balanced or unbalanced.</text>

<g font-family="Comic Sans MS, Arial" stroke="#111" stroke-width="5">
<rect x="70" y="270" width="915" height="260" rx="35" fill="#faf5ff"/>
<text x="527" y="340" text-anchor="middle" font-size="58" font-weight="900" fill="#111" stroke="none">A force is a <tspan fill="#7e22ce">PUSH</tspan> or a <tspan fill="#dc2626">PULL</tspan>.</text>
<rect x="220" y="400" width="120" height="85" fill="#a16207"/>
<path d="M120 445 h90" stroke="#7e22ce" stroke-width="12"/>
<path d="M200 415 l45 30 l-45 30z" fill="#7e22ce"/>
<text x="120" y="510" font-size="30" fill="#111" stroke="none">push</text>
<rect x="675" y="400" width="120" height="85" fill="#a16207"/>
<path d="M835 445 h-90" stroke="#dc2626" stroke-width="12"/>
<path d="M760 415 l-45 30 l45 30z" fill="#dc2626"/>
<text x="835" y="510" text-anchor="middle" font-size="30" fill="#111" stroke="none">pull</text>

<rect x="70" y="585" width="440" height="330" rx="30" fill="#f0fdf4"/>
<text x="290" y="650" text-anchor="middle" font-size="48" font-weight="900" fill="#16a34a" stroke="none">Balanced Forces</text>
<text x="290" y="705" text-anchor="middle" font-size="32" fill="#111" stroke="none">equal size, opposite directions</text>
<path d="M170 780 h100" stroke="#16a34a" stroke-width="12"/>
<path d="M185 750 l-45 30 l45 30z" fill="#16a34a"/>
<path d="M410 780 h-100" stroke="#16a34a" stroke-width="12"/>
<path d="M395 750 l45 30 l-45 30z" fill="#16a34a"/>
<rect x="210" y="825" width="160" height="55" fill="#a16207"/>
<text x="290" y="895" text-anchor="middle" font-size="28" fill="#111" stroke="none">object stays still</text>

<rect x="545" y="585" width="440" height="330" rx="30" fill="#fff1f2"/>
<text x="765" y="650" text-anchor="middle" font-size="48" font-weight="900" fill="#dc2626" stroke="none">Unbalanced Forces</text>
<text x="765" y="705" text-anchor="middle" font-size="32" fill="#111" stroke="none">not equal; motion changes</text>
<path d="M635 780 h80" stroke="#16a34a" stroke-width="10"/>
<path d="M650 753 l-40 27 l40 27z" fill="#16a34a"/>
<path d="M735 780 h160" stroke="#dc2626" stroke-width="14"/>
<path d="M880 740 l60 40 l-60 40z" fill="#dc2626"/>
<rect x="700" y="835" width="160" height="45" rx="20" fill="#2563eb"/>
<circle cx="735" cy="890" r="18" fill="#111"/><circle cx="825" cy="890" r="18" fill="#111"/>
<text x="765" y="915" text-anchor="middle" font-size="28" fill="#111" stroke="none">starts, stops, speeds up, slows down</text>

<rect x="70" y="970" width="440" height="330" rx="30" fill="#eff6ff"/>
<text x="290" y="1035" text-anchor="middle" font-size="52" font-weight="900" fill="#2563eb" stroke="none">Friction</text>
<text x="290" y="1090" text-anchor="middle" font-size="32" fill="#111" stroke="none">a force between surfaces that rub</text>
<text x="290" y="1135" text-anchor="middle" font-size="34" font-weight="900" fill="#2563eb" stroke="none">It slows motion.</text>
<rect x="150" y="1200" width="190" height="45" rx="20" fill="#ef4444"/>
<circle cx="190" cy="1255" r="18" fill="#111"/><circle cx="300" cy="1255" r="18" fill="#111"/>
<rect x="230" y="1155" width="85" height="45" fill="#f97316"/>
<text x="290" y="1290" text-anchor="middle" font-size="26" fill="#111" stroke="none">brakes, shoes, rough surfaces</text>

<rect x="545" y="970" width="440" height="330" rx="30" fill="#faf5ff"/>
<text x="765" y="1035" text-anchor="middle" font-size="52" font-weight="900" fill="#7e22ce" stroke="none">Gravity</text>
<text x="765" y="1090" text-anchor="middle" font-size="32" fill="#111" stroke="none">pulls objects toward Earth</text>
<circle cx="700" cy="1190" r="33" fill="#ef4444"/>
<path d="M700 1125 v40" stroke="#7e22ce" stroke-width="8"/>
<path d="M685 1148 l15 25 l15 -25z" fill="#7e22ce"/>
<circle cx="835" cy="1190" r="58" fill="#38bdf8"/>
<path d="M805 1160 q30 45 60 0" fill="none" stroke="#111"/>
<text x="765" y="1290" text-anchor="middle" font-size="26" fill="#111" stroke="none">falling objects, orbit, weight</text>
</g>

<text x="527" y="1435" text-anchor="middle" font-family="Comic Sans MS, Arial" font-size="44" font-weight="900" fill="#6f2dbd">Forces are all around us!</text>
</svg>
