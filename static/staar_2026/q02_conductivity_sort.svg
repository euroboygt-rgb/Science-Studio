<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <rect width="900" height="430" fill="#f6fbff"/>
  <text x="450" y="42" text-anchor="middle" font-size="30" font-family="Arial" font-weight="700" fill="#2d2a6e">Objects Sorted into Two Groups</text>
  <rect x="110" y="90" width="320" height="260" rx="18" fill="#fff" stroke="#b9a7ff" stroke-width="4"/>
  <rect x="470" y="90" width="320" height="260" rx="18" fill="#fff" stroke="#b9a7ff" stroke-width="4"/>
  <text x="270" y="130" text-anchor="middle" font-size="28" font-family="Arial" font-weight="700" fill="#5b3cc4">Group W</text>
  <text x="630" y="130" text-anchor="middle" font-size="28" font-family="Arial" font-weight="700" fill="#5b3cc4">Group X</text>
  <text x="150" y="185" font-size="24" font-family="Arial">• Glass marble</text>
  <text x="150" y="235" font-size="24" font-family="Arial">• Wood block</text>
  <text x="150" y="285" font-size="24" font-family="Arial">• Rubber band</text>
  <text x="510" y="185" font-size="24" font-family="Arial">• Steel paper clip</text>
  <text x="510" y="235" font-size="24" font-family="Arial">• Copper penny</text>
  <text x="510" y="285" font-size="24" font-family="Arial">• Aluminum foil</text>
  <text x="450" y="392" text-anchor="middle" font-size="20" font-family="Arial" font-weight="700" fill="#2d2a6e">Think: Which group has materials that allow electricity to flow?</text>
</svg>
