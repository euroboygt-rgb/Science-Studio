<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680">
  <rect width="1000" height="680" fill="#f6fbff"/>

  <text x="500" y="45" text-anchor="middle" font-size="30" font-family="Arial, sans-serif" font-weight="700" fill="#2d2a6e">
    Parallel Circuit with Two Switches
  </text>

  <text x="500" y="80" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="700" fill="#2d2a6e">
    Switch 1 is closed. Switch 2 is open.
  </text>

  <!-- Main side rails -->
  <line x1="160" y1="150" x2="160" y2="560" stroke="#f08a24" stroke-width="10" stroke-linecap="round"/>
  <line x1="840" y1="150" x2="840" y2="560" stroke="#f08a24" stroke-width="10" stroke-linecap="round"/>

  <!-- Battery at top connecting rails -->
  <line x1="160" y1="150" x2="420" y2="150" stroke="#f08a24" stroke-width="10" stroke-linecap="round"/>
  <line x1="580" y1="150" x2="840" y2="150" stroke="#f08a24" stroke-width="10" stroke-linecap="round"/>
  <rect x="420" y="120" width="160" height="60" rx="10" fill="#dddddd" stroke="#333333" stroke-width="4"/>
  <text x="500" y="157" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" font-weight="700">Battery</text>
  <text x="405" y="140" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" font-weight="700">−</text>
  <text x="595" y="140" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" font-weight="700">+</text>

  <!-- Branch 1: Lightbulb 1 complete -->
  <line x1="160" y1="255" x2="380" y2="255" stroke="#f08a24" stroke-width="10" stroke-linecap="round"/>
  <line x1="500" y1="255" x2="840" y2="255" stroke="#f08a24" stroke-width="10" stroke-linecap="round"/>
  <circle cx="440" cy="255" r="48" fill="#fff4a8" stroke="#333333" stroke-width="4"/>
  <path d="M420 275 Q440 235 460 275" fill="none" stroke="#333333" stroke-width="4"/>
  <line x1="440" y1="205" x2="440" y2="185" stroke="#f6c700" stroke-width="5"/>
  <line x1="480" y1="220" x2="495" y2="205" stroke="#f6c700" stroke-width="5"/>
  <line x1="400" y1="220" x2="385" y2="205" stroke="#f6c700" stroke-width="5"/>
  <text x="440" y="330" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" font-weight="700">Lightbulb 1 ON</text>

  <!-- Branch 2: Bell 1, Switch 1 closed, Bell 2 complete -->
  <line x1="160" y1="405" x2="275" y2="405" stroke="#f08a24" stroke-width="10" stroke-linecap="round"/>
  <line x1="345" y1="405" x2="445" y2="405" stroke="#f08a24" stroke-width="10" stroke-linecap="round"/>
  <line x1="555" y1="405" x2="655" y2="405" stroke="#f08a24" stroke-width="10" stroke-linecap="round"/>
  <line x1="725" y1="405" x2="840" y2="405" stroke="#f08a24" stroke-width="10" stroke-linecap="round"/>

  <circle cx="310" cy="405" r="40" fill="#e8e8e8" stroke="#333333" stroke-width="4"/>
  <text x="310" y="413" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="700">Bell 1</text>

  <rect x="445" y="365" width="110" height="80" fill="#ffffff" stroke="#333333" stroke-width="4"/>
  <line x1="462" y1="405" x2="538" y2="405" stroke="#333333" stroke-width="7" stroke-linecap="round"/>
  <text x="500" y="475" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="700">Switch 1 CLOSED</text>

  <circle cx="690" cy="405" r="40" fill="#e8e8e8" stroke="#333333" stroke-width="4"/>
  <text x="690" y="413" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="700">Bell 2</text>

  <!-- Branch 3: Switch 2 open and Lightbulb 2, broken branch -->
  <line x1="160" y1="555" x2="250" y2="555" stroke="#f08a24" stroke-width="10" stroke-linecap="round"/>
  <line x1="365" y1="555" x2="470" y2="555" stroke="#f08a24" stroke-width="10" stroke-linecap="round"/>
  <line x1="590" y1="555" x2="840" y2="555" stroke="#f08a24" stroke-width="10" stroke-linecap="round"/>

  <rect x="250" y="515" width="115" height="80" fill="#ffffff" stroke="#333333" stroke-width="4"/>
  <line x1="268" y1="555" x2="338" y2="520" stroke="#333333" stroke-width="7" stroke-linecap="round"/>
  <text x="307" y="625" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="700">Switch 2 OPEN</text>

  <circle cx="530" cy="555" r="48" fill="#ffffff" stroke="#333333" stroke-width="4"/>
  <path d="M510 575 Q530 535 550 575" fill="none" stroke="#333333" stroke-width="4"/>
  <text x="530" y="625" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" font-weight="700">Lightbulb 2 OFF</text>

  <rect x="120" y="90" width="760" height="42" rx="12" fill="#fff7d6" stroke="#2d2a6e" stroke-width="3"/>
  <text x="500" y="118" text-anchor="middle" font-size="19" font-family="Arial, sans-serif" font-weight="700" fill="#2d2a6e">
    The top and middle branches are complete paths. The bottom branch is open.
  </text>
</svg>
