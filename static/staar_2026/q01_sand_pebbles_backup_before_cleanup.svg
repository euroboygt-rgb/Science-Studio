<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460">
  <rect width="900" height="460" fill="#f6fbff"/>
  <text x="450" y="42" text-anchor="middle" font-size="30" font-family="Arial" font-weight="700" fill="#2d2a6e">Sand and Pebbles in Water</text>
  <rect x="260" y="90" width="380" height="300" rx="18" fill="#ffffff" stroke="#333" stroke-width="4"/>
  <rect x="280" y="155" width="340" height="215" fill="#bfe6ff" opacity="0.72"/>
  <line x1="280" y1="155" x2="620" y2="155" stroke="#4e9ed6" stroke-width="5"/>
  <ellipse cx="450" cy="370" rx="170" ry="28" fill="#d7b56d"/>
  <circle cx="390" cy="350" r="18" fill="#777"/>
  <circle cx="440" cy="345" r="15" fill="#888"/>
  <circle cx="492" cy="350" r="20" fill="#666"/>
  <circle cx="535" cy="358" r="13" fill="#999"/>
  <text x="330" y="425" text-anchor="middle" font-size="20" font-family="Arial" font-weight="700" fill="#6d4d00">Sand settles</text>
  <text x="570" y="425" text-anchor="middle" font-size="20" font-family="Arial" font-weight="700" fill="#333">Pebbles settle</text>
