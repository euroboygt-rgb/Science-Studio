<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
  <rect width="1000" height="620" fill="#f6fbff"/>
  <text x="500" y="45" text-anchor="middle" font-size="30" font-family="Arial, sans-serif" font-weight="700" fill="#2d2a6e">
    Six Common Objects
  </text>
  <text x="500" y="80" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" font-weight="700" fill="#2d2a6e">
    Which property cannot sort these objects into more than one group?
  </text>

  <!-- Row 1 -->
  <rect x="120" y="125" width="210" height="155" rx="16" fill="#ffffff" stroke="#d7def7" stroke-width="4"/>
  <ellipse cx="225" cy="175" rx="65" ry="28" fill="#eeeeee" stroke="#333" stroke-width="4"/>
  <rect x="160" y="175" width="130" height="50" fill="#f7f7f7" stroke="#333" stroke-width="4"/>
  <ellipse cx="160" cy="200" rx="20" ry="25" fill="#dddddd" stroke="#333" stroke-width="4"/>
  <text x="225" y="255" text-anchor="middle" font-size="20" font-family="Arial" font-weight="700">Cardboard tube</text>

  <rect x="395" y="125" width="210" height="155" rx="16" fill="#ffffff" stroke="#d7def7" stroke-width="4"/>
  <rect x="465" y="160" width="70" height="70" fill="#fff7d6" stroke="#333" stroke-width="4"/>
  <path d="M465 160 L490 135 L560 135 L535 160 Z" fill="#ffffff" stroke="#333" stroke-width="4"/>
  <path d="M535 160 L560 135 L560 205 L535 230 Z" fill="#eee7bb" stroke="#333" stroke-width="4"/>
  <text x="500" y="255" text-anchor="middle" font-size="20" font-family="Arial" font-weight="700">Sugar cube</text>

  <rect x="670" y="125" width="210" height="155" rx="16" fill="#ffffff" stroke="#d7def7" stroke-width="4"/>
  <path d="M730 185 C730 145 820 145 820 185 C820 225 730 225 730 185" fill="none" stroke="#777" stroke-width="10"/>
  <path d="M760 185 C760 165 800 165 800 185 C800 205 760 205 760 185" fill="none" stroke="#777" stroke-width="8"/>
  <text x="775" y="255" text-anchor="middle" font-size="20" font-family="Arial" font-weight="700">Steel paper clip</text>

  <!-- Row 2 -->
  <rect x="120" y="335" width="210" height="155" rx="16" fill="#ffffff" stroke="#d7def7" stroke-width="4"/>
  <ellipse cx="190" cy="390" rx="45" ry="25" fill="#eeeeee" stroke="#333" stroke-width="4"/>
  <line x1="230" y1="398" x2="300" y2="430" stroke="#777" stroke-width="8" stroke-linecap="round"/>
  <text x="225" y="465" text-anchor="middle" font-size="20" font-family="Arial" font-weight="700">Iron spoon</text>

  <rect x="395" y="335" width="210" height="155" rx="16" fill="#ffffff" stroke="#d7def7" stroke-width="4"/>
  <ellipse cx="500" cy="375" rx="65" ry="25" fill="#dddddd" stroke="#333" stroke-width="4"/>
  <rect x="435" y="375" width="130" height="55" fill="#eeeeee" stroke="#333" stroke-width="4"/>
  <ellipse cx="565" cy="402" rx="15" ry="27" fill="#cccccc" stroke="#333" stroke-width="4"/>
  <text x="500" y="465" text-anchor="middle" font-size="20" font-family="Arial" font-weight="700">Aluminum can</text>

  <rect x="670" y="335" width="210" height="155" rx="16" fill="#ffffff" stroke="#d7def7" stroke-width="4"/>
  <path d="M720 405 C780 370 820 430 750 435 C710 438 730 400 810 385" fill="none" stroke="#888" stroke-width="8" stroke-linecap="round"/>
  <text x="775" y="465" text-anchor="middle" font-size="20" font-family="Arial" font-weight="700">Cotton string</text>

  <rect x="165" y="535" width="670" height="45" rx="12" fill="#fff7d6" stroke="#2d2a6e" stroke-width="3"/>
  <text x="500" y="564" text-anchor="middle" font-size="20" font-family="Arial" font-weight="700" fill="#2d2a6e">
    All six objects are solids, so physical state would make only one group.
  </text>
</svg>
