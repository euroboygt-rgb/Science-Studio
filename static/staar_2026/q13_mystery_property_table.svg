  <text x="630" y="237" text-anchor="middle" font-size="20" font-family="Arial">Less dense</text>
  <text x="832" y="237" text-anchor="middle" font-size="20" font-family="Arial">Poor conductor</text>

  <text x="550" y="295" text-anchor="middle" font-size="22" font-family="Arial" font-weight="700" fill="#2d2a6e">
