  <text x="630" y="107" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">Relative Density</text>
  <text x="630" y="127" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">to Water</text>
  <text x="832" y="107" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">Electrical</text>
  <text x="832" y="127" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">Conductivity</text>

  <text x="237" y="157" text-anchor="middle" font-size="20" font-family="Arial">A</text>
  <text x="410" y="157" text-anchor="middle" font-size="20" font-family="Arial">Solid</text>
  <text x="630" y="157" text-anchor="middle" font-size="20" font-family="Arial">More dense</text>
  <text x="832" y="157" text-anchor="middle" font-size="20" font-family="Arial">Poor conductor</text>

  <text x="237" y="197" text-anchor="middle" font-size="20" font-family="Arial">B</text>
  <text x="410" y="197" text-anchor="middle" font-size="20" font-family="Arial">Liquid</text>
  <text x="630" y="197" text-anchor="middle" font-size="20" font-family="Arial">Less dense</text>
  <text x="832" y="197" text-anchor="middle" font-size="20" font-family="Arial">Poor conductor</text>

  <text x="237" y="237" text-anchor="middle" font-size="20" font-family="Arial">C</text>
