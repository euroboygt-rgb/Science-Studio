<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760">
  <rect width="1100" height="760" fill="#f6fbff"/>
  <text x="550" y="45" text-anchor="middle" font-size="30" font-family="Arial" font-weight="700" fill="#2d2a6e">
    Mystery Substance Properties
  </text>

  <!-- Main table -->
  <rect x="175" y="85" width="750" height="165" rx="8" fill="#ffffff" stroke="#333" stroke-width="4"/>
  <line x1="175" y1="130" x2="925" y2="130" stroke="#333" stroke-width="3"/>
  <line x1="300" y1="85" x2="300" y2="250" stroke="#333" stroke-width="3"/>
  <line x1="520" y1="85" x2="520" y2="250" stroke="#333" stroke-width="3"/>
  <line x1="740" y1="85" x2="740" y2="250" stroke="#333" stroke-width="3"/>
  <line x1="175" y1="170" x2="925" y2="170" stroke="#333" stroke-width="2"/>
  <line x1="175" y1="210" x2="925" y2="210" stroke="#333" stroke-width="2"/>

  <text x="237" y="115" text-anchor="middle" font-size="20" font-family="Arial" font-weight="700">Label</text>
