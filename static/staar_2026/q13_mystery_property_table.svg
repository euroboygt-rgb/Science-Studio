    <text x="100" y="67" text-anchor="middle" font-size="18" font-family="Arial">A</text>
    <text x="265" y="67" text-anchor="middle" font-size="18" font-family="Arial">Metal bolt</text>
    <text x="100" y="97" text-anchor="middle" font-size="18" font-family="Arial">B</text>
