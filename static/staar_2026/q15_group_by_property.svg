<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760">
  <rect width="1100" height="760" fill="#f6fbff"/>
  <text x="550" y="45" text-anchor="middle" font-size="30" font-family="Arial" font-weight="700" fill="#2d2a6e">
    Grouping Objects by Physical Property
  </text>
  <text x="550" y="82" text-anchor="middle" font-size="20" font-family="Arial" font-weight="700" fill="#2d2a6e">
    Which table correctly groups objects by a physical property?
  </text>

  <!-- A -->
  <g transform="translate(90,130)">
    <text x="0" y="35" font-size="28" font-family="Arial" font-weight="700">A</text>
    <rect x="45" y="0" width="410" height="160" fill="#fff" stroke="#333" stroke-width="3"/>
    <line x1="45" y1="45" x2="455" y2="45" stroke="#333" stroke-width="2"/>
    <line x1="250" y1="0" x2="250" y2="160" stroke="#333" stroke-width="2"/>
    <text x="147" y="30" text-anchor="middle" font-size="19" font-family="Arial" font-weight="700">Solid</text>
    <text x="352" y="30" text-anchor="middle" font-size="19" font-family="Arial" font-weight="700">Liquid</text>
    <text x="70" y="78" font-size="18" font-family="Arial">• Desk</text>
    <text x="70" y="108" font-size="18" font-family="Arial">• Salt</text>
    <text x="70" y="138" font-size="18" font-family="Arial">• Canola oil</text>
    <text x="275" y="78" font-size="18" font-family="Arial">• Honey</text>
    <text x="275" y="108" font-size="18" font-family="Arial">• Corn syrup</text>
    <text x="275" y="138" font-size="18" font-family="Arial">• Milk</text>
  </g>

  <!-- B -->
  <g transform="translate(595,130)">
    <text x="0" y="35" font-size="28" font-family="Arial" font-weight="700">B</text>
    <rect x="45" y="0" width="425" height="160" fill="#fff" stroke="#333" stroke-width="3"/>
    <line x1="45" y1="45" x2="470" y2="45" stroke="#333" stroke-width="2"/>
    <line x1="258" y1="0" x2="258" y2="160" stroke="#333" stroke-width="2"/>
    <text x="151" y="23" text-anchor="middle" font-size="17" font-family="Arial" font-weight="700">Good Thermal</text>
    <text x="151" y="42" text-anchor="middle" font-size="17" font-family="Arial" font-weight="700">Insulator</text>
    <text x="364" y="23" text-anchor="middle" font-size="17" font-family="Arial" font-weight="700">Poor Thermal</text>
    <text x="364" y="42" text-anchor="middle" font-size="17" font-family="Arial" font-weight="700">Insulator</text>
    <text x="70" y="78" font-size="18" font-family="Arial">• Cotton mitten</text>
    <text x="70" y="108" font-size="18" font-family="Arial">• Newspaper</text>
    <text x="70" y="138" font-size="18" font-family="Arial">• Air</text>
    <text x="285" y="78" font-size="18" font-family="Arial">• Aluminum foil</text>
    <text x="285" y="108" font-size="18" font-family="Arial">• Steel spoon</text>
    <text x="285" y="138" font-size="18" font-family="Arial">• Copper pot</text>
  </g>

  <!-- C -->
  <g transform="translate(90,405)">
    <text x="0" y="35" font-size="28" font-family="Arial" font-weight="700">C</text>
    <rect x="45" y="0" width="430" height="190" fill="#fff" stroke="#333" stroke-width="3"/>
    <line x1="45" y1="55" x2="475" y2="55" stroke="#333" stroke-width="2"/>
    <line x1="260" y1="0" x2="260" y2="190" stroke="#333" stroke-width="2"/>
    <text x="152" y="23" text-anchor="middle" font-size="17" font-family="Arial" font-weight="700">More Dense</text>
    <text x="152" y="43" text-anchor="middle" font-size="17" font-family="Arial" font-weight="700">than Water</text>
    <text x="367" y="23" text-anchor="middle" font-size="17" font-family="Arial" font-weight="700">Less Dense</text>
    <text x="367" y="43" text-anchor="middle" font-size="17" font-family="Arial" font-weight="700">than Water</text>
    <text x="70" y="88" font-size="18" font-family="Arial">• Rubbing alcohol</text>
    <text x="70" y="118" font-size="18" font-family="Arial">• Plastic ball</text>
    <text x="70" y="148" font-size="18" font-family="Arial">• Lamp oil</text>
    <text x="285" y="88" font-size="18" font-family="Arial">• Corn syrup</text>
    <text x="285" y="118" font-size="18" font-family="Arial">• Rock</text>
    <text x="285" y="148" font-size="18" font-family="Arial">• Metal bolt</text>
  </g>

  <!-- D -->
  <g transform="translate(595,405)">
    <text x="0" y="35" font-size="28" font-family="Arial" font-weight="700">D</text>
    <rect x="45" y="0" width="425" height="190" fill="#fff" stroke="#333" stroke-width="3"/>
    <line x1="45" y1="55" x2="470" y2="55" stroke="#333" stroke-width="2"/>
    <line x1="258" y1="0" x2="258" y2="190" stroke="#333" stroke-width="2"/>
    <text x="151" y="35" text-anchor="middle" font-size="19" font-family="Arial" font-weight="700">Magnetic</text>
    <text x="364" y="35" text-anchor="middle" font-size="19" font-family="Arial" font-weight="700">Non-magnetic</text>
    <text x="70" y="88" font-size="18" font-family="Arial">• Iron nail</text>
    <text x="70" y="118" font-size="18" font-family="Arial">• Aluminum can</text>
    <text x="70" y="148" font-size="18" font-family="Arial">• Copper ring</text>
    <text x="285" y="88" font-size="18" font-family="Arial">• Steel key</text>
    <text x="285" y="118" font-size="18" font-family="Arial">• Rubber band</text>
    <text x="285" y="148" font-size="18" font-family="Arial">• Wood stick</text>
  </g>

  <rect x="210" y="685" width="680" height="45" rx="12" fill="#ede9ff" stroke="#b9a7ff" stroke-width="3"/>
  <text x="550" y="714" text-anchor="middle" font-size="20" font-family="Arial" font-weight="700" fill="#2d2a6e">
    Check every object in both columns before choosing.
  </text>
</svg>
